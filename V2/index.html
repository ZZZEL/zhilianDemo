<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="智链大模型 Demo">
  <title>智链大模型 · 数智创新</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --bg: #fbfcfe;
      --panel: #ffffff;
      --ink: #141922;
      --muted: #657083;
      --faint: #96a0af;
      --line: #dde4ec;
      --soft: #eef3f7;
      --blue: #2f6fed;
      --teal: #0f9b8e;
      --amber: #d88913;
      --red: #d84a3a;
      --shadow: 0 18px 48px rgba(19, 28, 44, 0.07);
      --radius: 8px;
      --sidebar-width: 252px;
      --ui-font-size: 13px;
      --body-font-size: 15px;
      --body-line: 1.68;
      --reading-line: 1.76;
      --turn-gap: 24px;
      --question-answer-gap: 18px;
      --answer-next-gap: 30px;
      --ai-block-gap: 14px;
      --ai-result-gap: 16px;
      --ai-file-gap: 8px;
      --page-gutter: clamp(18px, 2.4vw, 42px);
      --home-max: 940px;
      --chat-track-width: 760px;
      --chat-max: var(--chat-track-width);
      --chat-preview-max: var(--chat-track-width);
      --composer-width: var(--chat-track-width);
      --preview-width: clamp(520px, 42vw, 880px);
      --sidebar-pad: 14px;
      --sidebar-control: 40px;
    }

    body.sidebar-collapsed {
      --sidebar-width: 72px;
    }

    body {
      margin: 0;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 42%, #f4f7fb 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
      line-height: 1.5;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      width: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 74px var(--sidebar-pad) 18px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(18px);
      box-shadow: 10px 0 32px rgba(19, 28, 44, 0.035);
      transition: width 220ms ease, padding 220ms ease;
    }

    .brand-shell {
      position: fixed;
      top: 18px;
      left: var(--sidebar-pad);
      z-index: 42;
      width: calc(var(--sidebar-width) - var(--sidebar-pad) - var(--sidebar-pad));
      height: 44px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--sidebar-control);
      align-items: center;
      gap: 8px;
      transition: left 220ms ease, width 220ms ease;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      width: 136px;
      min-width: 136px;
      height: 44px;
      overflow: visible;
      border: 0;
      background: transparent;
      border-radius: 10px;
      padding: 0;
      transition: opacity 180ms ease;
    }

    .brand:hover {
      opacity: 0.9;
    }

    .brand-logo {
      width: 136px;
      height: auto;
      display: block;
      flex: 0 0 auto;
      object-fit: contain;
    }

    .brand-mark {
      display: none;
      width: var(--sidebar-control);
      height: var(--sidebar-control);
      object-fit: contain;
      opacity: 1;
      transition: opacity 160ms ease;
    }

    .brand-shell .brand-toggle {
      width: var(--sidebar-control);
      height: var(--sidebar-control);
      min-height: var(--sidebar-control);
      padding: 0;
      justify-content: center;
      border: 1px solid transparent;
      color: #4f5b6d;
      background: transparent;
      justify-self: end;
    }

    .brand-shell .brand-toggle svg {
      width: 21px;
      height: 21px;
      stroke-width: 2;
    }

    .brand-toggle .sidebar-text {
      display: none;
    }

    .sidebar-collapsed .brand-shell {
      left: var(--sidebar-pad);
      width: var(--sidebar-control);
      height: var(--sidebar-control);
      grid-template-columns: var(--sidebar-control);
    }

    .sidebar-collapsed .brand {
      width: var(--sidebar-control);
      min-width: var(--sidebar-control);
      height: var(--sidebar-control);
      justify-content: center;
      border-radius: 10px;
    }

    .sidebar-collapsed .brand:hover {
      opacity: 1;
    }

    .sidebar-collapsed .brand-logo {
      display: none;
    }

    .sidebar-collapsed .brand-mark {
      display: block;
    }

    .sidebar-collapsed .brand-shell .brand-toggle {
      position: absolute;
      inset: 0;
      width: var(--sidebar-control);
      height: var(--sidebar-control);
      min-height: var(--sidebar-control);
      padding: 0;
      opacity: 0;
      pointer-events: none;
      color: #4f5b6d;
      background: rgba(255, 255, 255, 0.76);
      border-color: transparent;
      border-radius: 10px;
      box-shadow: none;
      backdrop-filter: blur(6px);
      transform: none;
    }

    .sidebar-collapsed .brand-shell .brand-toggle svg {
      width: 22px;
      height: 22px;
    }

    .sidebar-collapsed .brand-shell:hover .brand-mark {
      opacity: 0;
    }

    .sidebar-collapsed .brand-shell:hover .brand-toggle,
    .sidebar-collapsed .brand-toggle:focus-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar-collapsed .brand-shell .brand-toggle:hover {
      color: var(--ink);
      background: #f8fafc;
      border-color: transparent;
      transform: none;
    }

    .sidebar-icon-button {
      width: var(--sidebar-control);
      height: var(--sidebar-control);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #4f5b6d;
      background: transparent;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .sidebar-icon-button:hover,
    .sidebar-action:hover {
      color: var(--ink);
      background: #f8fafc;
      border-color: rgba(47, 111, 237, 0.28);
      transform: none;
    }

    .sidebar-action svg,
    .sidebar-search-trigger svg,
    .sidebar-search-field svg {
      width: 20px;
      height: 20px;
      justify-self: center;
      stroke: currentColor;
      stroke-width: 2;
    }

    .sidebar-icon-button svg,
    .history-main svg,
    .history-menu-button svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.9;
    }

    .sidebar-action,
    .sidebar-search-trigger,
    .sidebar-search-field {
      width: 100%;
      min-height: 40px;
      display: grid;
      grid-template-columns: var(--sidebar-control) minmax(0, 1fr);
      align-items: center;
      gap: 0;
      padding: 0;
      border-radius: 10px;
      font-size: var(--ui-font-size);
      font-weight: 760;
      line-height: 1;
      text-align: left;
    }

    .sidebar-action {
      border: 1px solid transparent;
      color: #243043;
      background: transparent;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .sidebar-action.is-active {
      color: #243043;
      background: transparent;
      border-color: transparent;
    }

    .sidebar-actions {
      display: grid;
      gap: 0;
      width: 100%;
      justify-items: stretch;
    }

    .sidebar-text {
      min-width: 0;
      padding-right: 10px;
      line-height: 1;
      white-space: nowrap;
    }

    .sidebar-search-wrap {
      width: 100%;
      display: grid;
      gap: 0;
    }

    .sidebar-search-trigger,
    .sidebar-search-field {
      border: 1px solid transparent;
      color: #4f5b6d;
      background: transparent;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .sidebar-search-trigger:hover,
    .sidebar-search-field:hover,
    .sidebar-search-field:focus-within {
      color: var(--ink);
      background: #f8fafc;
      border-color: rgba(47, 111, 237, 0.28);
      transform: none;
    }

    .sidebar-search-field {
      display: none;
      border-color: var(--line);
      background: #ffffff;
    }

    .sidebar-search-wrap.search-open .sidebar-search-trigger {
      display: none;
    }

    .sidebar-search-wrap.search-open .sidebar-search-field {
      display: grid;
    }

    .sidebar-search-field input {
      width: 100%;
      min-width: 0;
      padding-right: 10px;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font: inherit;
      font-size: var(--ui-font-size);
      font-weight: 500;
      line-height: 1;
    }

    .sidebar-search-field input::placeholder {
      color: var(--faint);
    }

    .sidebar-section {
      display: grid;
      gap: 8px;
      min-height: 0;
    }

    .sidebar-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 22px;
    }

    .history-section {
      flex: 1;
      grid-template-rows: auto minmax(0, 1fr);
      padding-top: 4px;
    }

    .sidebar-label {
      padding: 3px 6px 2px;
      color: var(--faint);
      font-size: 12px;
      font-weight: 800;
    }

    .report-card {
      width: 100%;
      min-height: 74px;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #243043;
      background: #f8fafc;
      box-shadow: none;
      text-align: left;
      transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .report-card:hover {
      transform: translateY(-1px);
      border-color: rgba(47, 111, 237, 0.36);
      background: #ffffff;
      box-shadow: none;
    }

    .report-type {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: #2f6fed;
      background: #edf4ff;
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
    }

    .report-type.is-pdf {
      color: #d92d20;
      background: #fff1f0;
    }

    .report-copy {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .report-title {
      min-width: 0;
      display: -webkit-box;
      overflow: hidden;
      color: #1e2736;
      font-size: 13px;
      font-weight: 760;
      line-height: 1.35;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .report-meta {
      color: var(--faint);
      font-size: 11.5px;
      font-weight: 720;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .history-list {
      grid-row: 2;
      display: grid;
      grid-auto-rows: min-content;
      align-content: start;
      gap: 0;
      overflow: visible;
      padding-right: 2px;
    }

    .history-section:not(.has-history) .history-list {
      display: none;
    }

    .history-row {
      position: relative;
      width: 100%;
      min-height: 38px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 30px;
      align-items: center;
      border-radius: 9px;
      color: #4f5b6d;
      background: transparent;
      transition: background 160ms ease, color 160ms ease;
    }

    .history-row.menu-open {
      z-index: 8;
    }

    .history-row:hover,
    .history-row.menu-open,
    .history-row.is-active {
      color: var(--ink);
      background: #f4f7fb;
    }

    .history-row.is-active {
      color: #1f54b7;
    }

    .history-main {
      min-width: 0;
      min-height: 38px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      padding: 8px 10px;
      border: 0;
      border-radius: 9px 0 0 9px;
      color: inherit;
      background: transparent;
      font-size: var(--ui-font-size);
      line-height: 1;
      text-align: left;
      cursor: pointer;
    }

    .history-main:focus-visible {
      outline: 2px solid rgba(47, 111, 237, 0.22);
      outline-offset: -2px;
    }

    .history-star {
      display: none;
      color: #f2a900;
      font-size: 14px;
      line-height: 1;
    }

    .history-row.is-favorite .history-star {
      display: none;
    }

    .history-title {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-title-input {
      width: 100%;
      min-width: 0;
      height: 24px;
      padding: 0 6px;
      border: 1px solid #d8e0ea;
      border-radius: 6px;
      outline: 0;
      color: var(--ink);
      background: #ffffff;
      font: inherit;
      font-size: var(--ui-font-size);
      font-weight: 720;
      line-height: 1;
      box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.08);
    }

    .history-menu-button {
      width: 30px;
      height: 34px;
      display: grid;
      place-items: center;
      margin-right: 4px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #6d7787;
      background: transparent;
      transition: opacity 160ms ease, background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .history-menu-button:hover {
      color: var(--ink);
      background: #e8edf4;
      border-color: #d8e0ea;
    }

    .history-menu {
      position: absolute;
      top: 38px;
      right: -104px;
      z-index: 5;
      min-width: 116px;
      display: none;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 16px 34px rgba(19, 28, 44, 0.12);
    }

    .history-row.menu-open .history-menu {
      display: grid;
      gap: 2px;
    }

    .history-menu button {
      width: 100%;
      min-height: 30px;
      padding: 6px 9px;
      border: 0;
      border-radius: 7px;
      color: #344054;
      background: transparent;
      font-size: var(--ui-font-size);
      line-height: 1.2;
      text-align: left;
    }

    .history-menu button:hover {
      color: var(--ink);
      background: #f4f7fb;
    }

    .history-menu button[data-history-action="delete"] {
      color: #bc3b2d;
    }

    .history-menu button[data-history-action="favorite"] {
      display: none;
    }

    .history-empty {
      grid-row: 2;
      align-self: stretch;
      display: grid;
      place-items: center;
      padding: 8px 7px;
      color: var(--faint);
      font-size: 12.5px;
      line-height: 1.45;
      text-align: center;
    }

    .history-section.has-history .history-empty {
      display: none;
    }

    .account-card {
      width: 100%;
      min-height: var(--sidebar-control);
      display: grid;
      grid-template-columns: var(--sidebar-control) minmax(0, 1fr);
      align-items: center;
      gap: 0;
      margin-top: auto;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #243043;
      background: transparent;
      text-align: left;
      cursor: default;
      transition: background 180ms ease, color 180ms ease;
    }

    .account-card:hover {
      background: #f8fafc;
    }

    .account-card.is-disabled,
    .account-card[aria-disabled="true"] {
      color: #7d8796;
      cursor: not-allowed;
    }

    .account-card.is-disabled:hover,
    .account-card[aria-disabled="true"]:hover {
      background: #f5f7fa;
    }

    .account-avatar {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      justify-self: center;
      border-radius: 999px;
      color: #ffffff;
      background: linear-gradient(135deg, #2f6fed, #0f9b8e);
      font-size: 12px;
      font-weight: 850;
      line-height: 1;
    }

    .account-copy {
      min-width: 0;
      display: grid;
      gap: 3px;
      padding-right: 10px;
    }

    .account-name {
      overflow: hidden;
      color: #1f2937;
      font-size: var(--ui-font-size);
      font-weight: 800;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-role {
      overflow: hidden;
      color: var(--faint);
      font-size: 11.5px;
      font-weight: 650;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-collapsed .app-sidebar {
      width: var(--sidebar-width);
      padding: 74px var(--sidebar-pad) 18px;
      overflow: visible;
    }

    .sidebar-collapsed .sidebar-actions {
      justify-items: start;
      gap: 0;
    }

    .sidebar-collapsed .sidebar-search-wrap {
      justify-items: start;
    }

    .sidebar-collapsed .sidebar-icon-button,
    .sidebar-collapsed .sidebar-action,
    .sidebar-collapsed .sidebar-search-trigger,
    .sidebar-collapsed .sidebar-search-field {
      width: var(--sidebar-control);
      height: var(--sidebar-control);
      min-height: var(--sidebar-control);
      grid-template-columns: var(--sidebar-control);
      padding: 0;
      color: #4f5b6d;
      border-color: transparent;
      background: transparent;
    }

    .sidebar-collapsed .sidebar-icon-button:hover,
    .sidebar-collapsed .sidebar-action:hover,
    .sidebar-collapsed .sidebar-search-trigger:hover,
    .sidebar-collapsed .sidebar-search-field:hover {
      color: var(--ink);
      background: #f8fafc;
      border-color: rgba(47, 111, 237, 0.28);
      transform: none;
    }

    .sidebar-collapsed .sidebar-search-field {
      display: none;
    }

    .sidebar-collapsed .sidebar-search-wrap.search-open .sidebar-search-trigger {
      display: grid;
    }

    .sidebar-collapsed .sidebar-search-field input {
      display: none;
    }

    .sidebar-collapsed .sidebar-text,
    .sidebar-collapsed .sidebar-label,
    .sidebar-collapsed .account-copy,
    .sidebar-collapsed .history-list,
    .sidebar-collapsed .history-empty {
      display: none;
    }

    .sidebar-collapsed .account-card {
      width: var(--sidebar-control);
      height: var(--sidebar-control);
      min-height: var(--sidebar-control);
      grid-template-columns: var(--sidebar-control);
      padding: 0;
      margin-inline: 0;
      border-radius: 10px;
    }

    .sidebar-collapsed .account-avatar {
      width: 32px;
      height: 32px;
      font-size: 12px;
    }

    .view {
      display: none;
      animation: viewIn 240ms ease both;
    }

    .view.active {
      display: block;
    }

    .home.view.active {
      display: flex;
    }

    .home {
      width: calc(100% - var(--sidebar-width));
      margin-left: var(--sidebar-width);
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.52), rgba(251, 252, 254, 0.66)), url("assets/page-bg.svg");
      background-size: cover;
      background-position: center;
      padding: clamp(48px, 7vh, 86px) var(--page-gutter) 48px;
      flex-direction: column;
      justify-content: center;
      transition: margin-left 220ms ease, width 220ms ease;
    }

    .home-hero {
      width: min(var(--home-max), 100%);
      margin: 0 auto;
      text-align: center;
    }

    .eyebrow {
      display: none;
    }

    h1 {
      max-width: 720px;
      margin: 0 auto 18px;
      font-size: clamp(40px, 5.4vw, 64px);
      line-height: 1.08;
      letter-spacing: 0;
      color: #0570f7;
      font-weight: 850;
    }

    .lead {
      display: block;
      margin: 0 auto clamp(30px, 4vh, 46px);
      color: #222936;
      font-size: clamp(19px, 2vw, 30px);
      font-weight: 500;
      line-height: 1.45;
    }

    .composer {
      width: min(var(--home-max), 100%);
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .composer textarea {
      width: 100%;
      min-height: 132px;
      resize: none;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      line-height: 1.65;
      font-size: 15px;
    }

    .composer textarea::placeholder {
      color: #98a3b2;
    }

    .attachment-tray {
      display: none;
      grid-template-columns: repeat(4, minmax(0, max-content));
      justify-content: start;
      gap: 8px;
      max-width: 100%;
      overflow-x: auto;
      padding: 2px 2px 10px;
    }

    .attachment-tray.has-files {
      display: grid;
    }

    .attachment-chip {
      position: relative;
      width: 164px;
      max-width: 164px;
      min-height: 42px;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 6px 26px 6px 8px;
      border: 1px solid #e1e7ef;
      border-radius: 9px;
      color: #344054;
      background: #f8fafc;
      animation: chipIn 180ms ease both;
      transition: opacity 150ms ease, transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    .attachment-chip.is-removing {
      opacity: 0;
      transform: scale(0.96);
    }

    .attachment-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: var(--blue);
      background: #edf4ff;
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
    }

    .attachment-icon.is-pdf {
      color: #d92d20;
      background: #fff1f0;
    }

    .attachment-icon.is-doc {
      color: #2f6fed;
      background: #edf4ff;
    }

    .attachment-icon.is-sheet {
      color: #08875d;
      background: #eaf8f1;
    }

    .attachment-icon.is-slide {
      color: #c05621;
      background: #fff4e8;
    }

    .attachment-icon.is-image {
      color: #7c3aed;
      background: #f3edff;
    }

    .attachment-icon.is-text {
      color: #475467;
      background: #eef2f6;
    }

    .attachment-main {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .attachment-name {
      overflow: hidden;
      color: #253044;
      font-size: 12.5px;
      font-weight: 760;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-meta {
      color: #8a95a6;
      font-size: 11px;
      font-weight: 650;
      line-height: 1;
    }

    .attachment-remove {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      opacity: 0;
      border: 0;
      border-radius: 999px;
      color: #667085;
      background: #e9eef5;
      box-shadow: none;
      font-size: 14px;
      line-height: 1;
      pointer-events: none;
      transition: opacity 150ms ease, background 150ms ease, color 150ms ease;
    }

    .attachment-chip:hover .attachment-remove {
      opacity: 1;
      pointer-events: auto;
    }

    .attachment-remove:hover {
      color: var(--ink);
      background: #dce4ee;
    }

    .message-attachments {
      max-width: min(760px, 100%);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 8px;
    }

    .message-attachment {
      width: 156px;
      max-width: 156px;
      min-height: 38px;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 0;
      border-radius: 0;
      color: #344054;
      background: transparent;
    }

    .user .message-attachments {
      max-width: min(560px, 78%);
      justify-content: flex-end;
    }

    .assistant .message-attachment {
      background: transparent;
      border: 0;
    }

    .message-attachment .attachment-icon {
      width: 28px;
      height: 28px;
    }

    .message-attachment .attachment-name {
      color: inherit;
    }

    .message-attachment .attachment-meta {
      color: #8a95a6;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 0;
      padding-top: 8px;
    }

    .composer-tools {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .composer-tools.left {
      justify-content: flex-start;
    }

    .composer-tools.right {
      justify-content: flex-end;
      margin-left: auto;
    }

    .composer-tools.right {
      gap: 8px;
    }

    .tool-button {
      --control-size: 38px;
      min-width: var(--control-size);
      height: var(--control-size);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 0 0 auto;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #647084;
      background: transparent;
      font-size: 12.5px;
      font-weight: 760;
      line-height: 1;
      transition: background 170ms ease, border-color 170ms ease, color 170ms ease, transform 170ms ease;
    }

    .tool-button:hover {
      color: #1f54b7;
      background: #f4f8ff;
      border-color: #dce8ff;
      transform: translateY(-1px);
    }

    .tool-button.is-on,
    .tool-button[aria-pressed="true"] {
      color: var(--blue);
      background: #edf4ff;
      border-color: #d8e7ff;
    }

    .tool-button.is-disabled,
    .tool-button[aria-disabled="true"] {
      color: #a4adba;
      background: transparent;
      border-color: transparent;
      cursor: not-allowed;
      transform: none;
    }

    .tool-button.is-disabled:hover,
    .tool-button[aria-disabled="true"]:hover {
      color: #8f99a8;
      background: #f3f5f8;
      border-color: #e3e8ef;
      transform: none;
    }

    .tool-button.is-disabled svg,
    .tool-button[aria-disabled="true"] svg {
      opacity: 0.76;
    }

    .tool-button svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      stroke: currentColor;
      stroke-width: 1.9;
    }

    .tool-button.icon-only,
    .composer-tools.right .tool-button {
      width: var(--control-size);
      padding: 0;
    }

    .tool-label {
      white-space: nowrap;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    .hint {
      display: none;
    }

    .send-button {
      width: 38px;
      height: 38px;
      min-width: 38px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      border: 0;
      border-radius: 10px;
      color: #ffffff;
      background: var(--blue);
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .send-button:hover {
      background: #245ecb;
      transform: translateY(-1px);
    }

    .send-button:disabled {
      color: #8f99a8;
      background: #eef1f5;
      cursor: not-allowed;
      transform: none;
    }

    .send-button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    .primary-btn,
    .ghost-btn {
      min-height: 40px;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 800;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .primary-btn {
      border: 0;
      color: #ffffff;
      background: var(--blue);
    }

    .primary-btn:hover {
      background: #245ecb;
      transform: translateY(-1px);
    }

    .primary-btn:disabled {
      background: #bac4d1;
      cursor: not-allowed;
      transform: none;
    }

    .ghost-btn {
      border: 1px solid rgba(47, 111, 237, 0.24);
      color: var(--blue);
      background: #ffffff;
    }

    .judgement-section {
      width: min(var(--home-max), 100%);
      margin: 0 auto;
    }

    .case-prompt {
      width: min(var(--home-max), 100%);
      margin: clamp(26px, 3.4vh, 38px) auto 8px;
      color: #5e6a7d;
      font-size: 14px;
      font-weight: 760;
      line-height: 1;
    }

    .qa-section {
      width: min(var(--home-max), 100%);
      margin: 16px auto 0;
    }

    .trend-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .qa-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: stretch;
    }

    .trend-card {
      position: relative;
      overflow: hidden;
      min-height: 132px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      padding: 17px;
      text-align: left;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 251, 255, 0.92));
      border: 1px solid rgba(221, 228, 236, 0.86);
      border-radius: 14px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .qa-card {
      min-height: 38px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 14px;
      border: 1px solid rgba(221, 228, 236, 0.9);
      border-radius: 999px;
      color: #273449;
      background: rgba(255, 255, 255, 0.7);
      text-align: left;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .qa-card:nth-child(5) {
      margin-left: 48px;
    }

    .trend-card::before {
      content: none;
    }

    .trend-card:hover {
      transform: translateY(-3px);
      border-color: rgba(47, 111, 237, 0.45);
      box-shadow: 0 18px 38px rgba(19, 28, 44, 0.08);
      background: #ffffff;
    }

    .qa-card:hover {
      transform: translateY(-1px);
      border-color: rgba(47, 111, 237, 0.3);
      background: rgba(255, 255, 255, 0.96);
    }

    .trend-card:hover::before {
      opacity: 0;
    }

    .case-kicker {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #2f6fed;
      font-size: 12px;
      font-weight: 850;
      line-height: 1;
    }

    .case-type {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: max-content;
      min-height: 23px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(47, 111, 237, 0.08);
    }

    .case-body {
      position: relative;
      z-index: 1;
      display: grid;
      align-content: start;
      gap: 9px;
    }

    .trend-card h3 {
      margin: 0;
      font-size: 15.8px;
      line-height: 1.43;
      letter-spacing: 0;
      font-weight: 820;
    }

    .qa-card h3 {
      margin: 0;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 720;
      white-space: nowrap;
    }

    .trend-card p {
      display: -webkit-box;
      margin: 0;
      overflow: hidden;
      color: #647084;
      font-size: 12.8px;
      line-height: 1.55;
      font-weight: 520;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .reports-view {
      min-height: 100vh;
      height: 100vh;
      margin-left: var(--sidebar-width);
      width: calc(100% - var(--sidebar-width));
      overflow: hidden;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 42%, #f4f7fb 100%);
      transition: margin-left 220ms ease, width 220ms ease;
    }

    .reports-view.active {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: stretch;
    }

    .reports-view.preview-open,
    .reports-view.preview-closing {
      grid-template-columns: minmax(0, 1fr) var(--preview-width);
      gap: 0;
    }

    .reports-shell {
      width: min(1180px, 100%);
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 18px;
      margin: 0 auto;
      padding: clamp(42px, 6vh, 68px) var(--page-gutter);
      overflow: auto;
    }

    .reports-view.preview-open .reports-shell,
    .reports-view.preview-closing .reports-shell {
      width: 100%;
      margin: 0;
      border-right: 1px solid var(--line);
    }

    .reports-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(221, 228, 236, 0.9);
    }

    .reports-title {
      display: grid;
    }

    .reports-title h2 {
      margin: 0;
      color: #151b25;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 820;
    }

    .reports-head-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .reports-search {
      width: min(280px, 28vw);
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #5b6678;
      background: rgba(255, 255, 255, 0.82);
      transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .reports-search:focus-within {
      border-color: rgba(47, 111, 237, 0.36);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.08);
    }

    .reports-search svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      stroke: currentColor;
      stroke-width: 2;
    }

    .reports-search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 560;
    }

    .reports-search input::placeholder {
      color: var(--faint);
    }

    .reports-badge {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--faint);
      background: transparent;
      font-size: 12.5px;
      font-weight: 720;
      white-space: nowrap;
    }

    .reports-board {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      align-content: start;
      gap: 14px;
      overflow: hidden;
    }

    .reports-list-head {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0;
      color: #8b96a7;
      font-size: 12px;
      font-weight: 780;
      line-height: 1;
    }

    .reports-limit {
      color: #a0aaba;
      font-weight: 680;
    }

    .reports-grid {
      display: grid;
      align-content: start;
      gap: 0;
      overflow: auto;
      padding: 0 2px 8px 0;
    }

    .report-group {
      display: grid;
      gap: 10px;
      padding: 18px 0 20px;
      border-top: 1px solid rgba(221, 228, 236, 0.82);
    }

    .report-group:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .report-group-title {
      min-width: 0;
      padding: 0 2px;
    }

    .report-group-title strong {
      display: block;
      overflow: hidden;
      color: #1f2937;
      font-size: 14.5px;
      font-weight: 820;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .report-group-files {
      min-width: 0;
      display: flex;
      align-items: stretch;
      gap: 10px;
      overflow-x: auto;
      padding: 1px 2px 6px;
    }

    .report-time {
      color: var(--faint);
      font-size: 11.5px;
      font-weight: 640;
      line-height: 1.25;
    }

    .reports-grid .report-card {
      min-height: 96px;
      flex: 0 0 280px;
      align-items: start;
      grid-template-columns: 38px minmax(0, 1fr);
      padding: 14px;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.86);
    }

    .reports-grid .report-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .reports-grid .report-card.is-active {
      border-color: rgba(47, 111, 237, 0.42);
      background: #f8fbff;
      box-shadow: 0 12px 28px rgba(19, 28, 44, 0.06);
    }

    .reports-empty {
      display: grid;
      place-items: center;
      min-height: 220px;
      margin: 0;
      border: 1px dashed rgba(221, 228, 236, 0.9);
      border-radius: 12px;
      color: var(--faint);
      background: rgba(248, 250, 252, 0.58);
      font-size: 13px;
      text-align: center;
    }

    .reports-board.has-reports .reports-empty {
      display: none;
    }

    .chat-view {
      min-height: 100vh;
      height: 100vh;
      margin-left: var(--sidebar-width);
      width: calc(100% - var(--sidebar-width));
      overflow: hidden;
      transition: margin-left 220ms ease, width 220ms ease;
    }

    .chat-view.active {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }

    .chat-view.preview-open,
    .chat-view.preview-closing {
      grid-template-columns: minmax(0, 1fr) var(--preview-width);
      gap: 0;
    }

    .chat-view.preview-open .chat-shell,
    .chat-view.preview-closing .chat-shell {
      padding-left: 0;
      border-right: 1px solid var(--line);
    }

    .chat-view.preview-open .messages,
    .chat-view.preview-closing .messages {
      width: 100%;
    }

    .chat-view.preview-open .chat-composer,
    .chat-view.preview-closing .chat-composer {
      width: min(var(--chat-track-width), calc(100% - var(--page-gutter) - var(--page-gutter)));
    }

    .chat-shell {
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }

    .messages {
      width: 100%;
      margin: 0;
      padding: clamp(28px, 4vh, 44px) var(--page-gutter) 22px;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .messages:not(.is-scrolling) {
      scrollbar-width: none;
    }

    .messages:not(.is-scrolling)::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .message {
      width: min(var(--chat-track-width), 100%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin: 0 auto;
      animation: rise 320ms ease both;
    }

    .message+.message {
      margin-top: var(--turn-gap);
    }

    .message.user+.message.assistant {
      margin-top: var(--question-answer-gap);
    }

    .message.assistant+.message.user {
      margin-top: var(--answer-next-gap);
    }

    .message.user {
      align-items: flex-end;
    }

    .message.assistant {
      align-items: stretch;
    }

    .assistant-output {
      width: 100%;
      max-width: 100%;
      display: grid;
      gap: 0;
    }

    .assistant-output>* {
      margin: 0;
    }

    .assistant-output>*+* {
      margin-top: var(--ai-block-gap);
    }

    .assistant-output>.process-card+.result-bubble {
      margin-top: var(--ai-result-gap);
    }

    .assistant-output>.result-bubble+.file-card.output-file {
      margin-top: var(--ai-file-gap);
    }

    .bubble {
      max-width: min(760px, 100%);
      padding: 15px 18px;
      border-radius: 8px;
      line-height: var(--body-line);
      font-size: var(--body-font-size);
      white-space: pre-wrap;
    }

    .user .bubble {
      max-width: min(560px, 78%);
      color: #ffffff;
      background: var(--blue);
    }

    .assistant .bubble {
      background: #ffffff;
      border: 1px solid var(--line);
      box-shadow: 0 10px 28px rgba(19, 28, 44, 0.04);
    }

    .result-bubble {
      display: grid;
      gap: 0;
      padding: 16px 19px;
    }

    .result-text {
      display: grid;
      gap: 17px;
      white-space: normal;
    }

    .result-text>* {
      animation: resultIn 220ms ease both;
    }

    .result-text p {
      margin: 0;
      color: #1c2430;
      font-size: 15px;
      line-height: var(--reading-line);
      font-weight: 400;
    }

    .result-text p:first-child {
      color: #151b25;
      font-weight: 400;
    }

    .result-text h2,
    .result-text h3 {
      margin: 0;
      color: #151b25;
      letter-spacing: 0;
    }

    .result-text h2 {
      padding-top: 2px;
      font-size: 16.5px;
      line-height: 1.45;
      font-weight: 760;
    }

    .result-text h3 {
      font-size: 15.2px;
      line-height: 1.45;
      font-weight: 740;
    }

    .result-text strong {
      font-weight: 760;
    }

    .result-text em {
      font-style: italic;
    }

    .result-text code {
      padding: 2px 5px;
      border-radius: 5px;
      color: #263142;
      background: #f1f4f8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
    }

    .result-text a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
    }

    .result-text a:hover {
      text-decoration: underline;
    }

    .result-text ul {
      display: grid;
      gap: 8px;
      margin: 0;
      padding-left: 20px;
    }

    .result-text li {
      color: #1c2430;
      font-size: 14.5px;
      line-height: 1.72;
      font-weight: 400;
    }

    .result-text hr {
      width: 100%;
      height: 1px;
      margin: 2px 0;
      border: 0;
      background: #edf1f5;
    }

    .result-table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #e3e8ef;
      border-radius: 8px;
      background: #ffffff;
    }

    .result-text table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      color: #1c2430;
      font-size: 13px;
      line-height: 1.62;
    }

    .result-text th,
    .result-text td {
      padding: 10px 12px;
      border-bottom: 1px solid #edf1f5;
      text-align: left;
      vertical-align: top;
    }

    .result-text th {
      color: #334155;
      background: #f8fafc;
      font-size: 12.5px;
      font-weight: 760;
      white-space: nowrap;
    }

    .result-text tr:last-child td {
      border-bottom: 0;
    }

    .process-card {
      width: 100%;
      max-width: 100%;
      min-height: 0;
      padding: 16px 18px 4px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      animation: rise 320ms ease both;
    }

    .file-card {
      width: fit-content;
      max-width: min(520px, 100%);
      overflow: hidden;
      padding: 0;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: none;
      color: inherit;
      cursor: pointer;
      text-align: left;
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .file-card:hover {
      background: #ffffff;
      border-color: rgba(47, 111, 237, 0.36);
      transform: translateY(-1px);
    }

    .process-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 0 14px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      font-size: 13.5px;
      text-align: left;
      cursor: pointer;
    }

    .chevron {
      width: 16px;
      height: 16px;
      display: inline-grid;
      place-items: center;
      color: var(--faint);
      font-size: 0;
      line-height: 0;
      transition: transform 180ms ease;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .chevron::before {
      content: "";
      width: 6px;
      height: 6px;
      border-right: 1.7px solid currentColor;
      border-bottom: 1.7px solid currentColor;
      transform: rotate(45deg);
      transform-origin: 50% 50%;
    }

    .process-card.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .process-list {
      position: relative;
      padding: 0 0 2px 34px;
      display: grid;
      gap: 0;
    }

    .process-card.collapsed .process-list {
      display: none;
    }

    .process-card:not(.planned) {
      padding-bottom: 16px;
    }

    .process-card:not(.planned) .process-toggle {
      padding-bottom: 0;
    }

    .process-card:not(.planned) .process-list {
      display: none;
    }

    .process-card.planning-card .process-list {
      padding-left: 0;
    }

    .process-card.planning-card .process-list::before {
      display: none;
    }

    .process-list::before {
      content: "";
      position: absolute;
      top: 13px;
      bottom: 13px;
      left: 11px;
      width: 1px;
      background: repeating-linear-gradient(to bottom,
          #d8dee7 0,
          #d8dee7 5px,
          transparent 5px,
          transparent 10px);
    }

    .process-step {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 0 0 22px;
      opacity: 1;
      transition: opacity 200ms ease;
      animation: stepIn 260ms ease both;
    }

    .process-step.active {
      opacity: 1;
    }

    .process-step.done {
      opacity: 1;
    }

    .planning-step {
      padding: 0 0 16px;
    }

    .planning-step .step-dot {
      display: none;
    }

    .planning-step .step-copy {
      display: grid;
      gap: 10px;
    }

    .planning-spinner {
      width: 9px;
      height: 9px;
      border: 1.5px solid var(--blue);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }

    .process-card.planned .process-toggle .planning-spinner {
      border-color: var(--teal);
      background: var(--teal);
      animation: none;
      box-shadow: inset 0 0 0 2px #ffffff;
    }

    .planning-nodes {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      max-width: 520px;
      padding-left: 30px;
    }

    .planning-nodes::before {
      content: "";
      position: absolute;
      top: 9px;
      bottom: 9px;
      left: 9px;
      width: 1px;
      background: #d8dee7;
    }

    .plan-node {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #647084;
      font-size: 12.3px;
      line-height: 1.35;
      opacity: 1;
      transform: translateY(0);
      transition: color 180ms ease, opacity 180ms ease, transform 180ms ease;
    }

    .plan-node.queued {
      opacity: 0;
      transform: translateY(4px);
    }

    .plan-node.loading {
      color: #245ecb;
    }

    .plan-node.done {
      color: #3f4a5c;
    }

    .plan-index {
      position: absolute;
      left: -30px;
      top: -1px;
      width: 19px;
      height: 19px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      color: #647084;
      background: #ffffff;
      border: 1px solid #d8dee7;
      font-size: 10px;
      font-weight: 800;
    }

    .plan-node.loading .plan-index,
    .plan-node.done .plan-index {
      color: #ffffff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .plan-node.done .plan-index {
      background: var(--teal);
      border-color: var(--teal);
    }

    .plan-title {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .step-dot {
      position: absolute;
      left: -32px;
      top: 2px;
      width: 19px;
      height: 19px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--muted);
      background: #ffffff;
      border: 1px solid #d8dee7;
      font-size: 10px;
      font-weight: 800;
    }

    .active .step-dot {
      color: #ffffff;
      background: var(--blue);
      border-color: var(--blue);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .done .step-dot {
      color: #ffffff;
      background: var(--teal);
      border-color: var(--teal);
      animation: none;
    }

    .step-copy strong {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      color: #1b2430;
      font-size: 14.5px;
      line-height: 1.42;
    }

    .step-title-icon,
    .chip-icon {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      color: currentColor;
    }

    .step-title-icon {
      width: 15px;
      height: 15px;
      color: var(--blue);
    }

    .chip-icon {
      width: 13px;
      height: 13px;
    }

    .step-title-icon svg,
    .chip-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
    }

    .step-copy p {
      margin: 0;
      color: var(--muted);
      font-size: 12.8px;
      line-height: 1.58;
    }

    .step-copy p:empty {
      display: none;
    }

    .step-chips {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      align-items: start;
      padding-top: 1px;
    }

    .step-sections {
      display: grid;
      gap: 8px;
      padding-top: 5px;
    }

    .step-section {
      display: grid;
      gap: 6px;
      padding: 7px 0 9px;
      border: 0;
      border-top: 1px solid #edf1f5;
      background: transparent;
      transition: opacity 180ms ease;
    }

    .step-section:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .step-section.agent-section {
      background: transparent;
    }

    .section-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #273142;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.36;
      text-align: left;
      cursor: pointer;
    }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .section-actions {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
      flex: 0 0 auto;
    }

    .section-chevron {
      width: 14px;
      height: 14px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--faint);
      font-size: 12px;
      transition: transform 160ms ease;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .section-chevron {
      font-size: 0;
      line-height: 0;
    }

    .section-chevron::before {
      content: "";
      width: 5.5px;
      height: 5.5px;
      border-right: 1.6px solid currentColor;
      border-bottom: 1.6px solid currentColor;
      transform: rotate(45deg);
      transform-origin: 50% 50%;
    }

    .step-section.collapsed .section-chevron {
      transform: rotate(-90deg);
    }

    .agent-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 230px;
      min-width: 0;
      padding: 4px 7px;
      border: 1px solid #dce8ff;
      border-radius: 7px;
      color: #245ecb;
      background: #f4f8ff;
    }

    .agent-tag .agent-mark {
      width: 16px;
      height: 16px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      color: #2f6fed;
    }

    .agent-tag .agent-mark svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }

    .agent-tag .agent-name {
      color: #1f54b7;
      font-size: 11.5px;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-desc {
      margin: 0;
      color: var(--muted);
      font-size: 12.8px;
      line-height: 1.58;
    }

    .step-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      max-width: 100%;
      padding: 5px 9px;
      color: #4e5868;
      background: #f1f3f5;
      border-radius: 999px;
      font-size: 12.5px;
      line-height: 1.32;
      animation: chipIn 220ms ease both;
    }

    .step-chip.queued {
      display: none;
    }

    .step-chip.loading {
      color: #245ecb;
      background: #edf4ff;
    }

    .step-chip.loading::before {
      content: "";
      width: 8px;
      height: 8px;
      border: 1.5px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }

    .step-chip.done {
      color: #3c4656;
      background: #f1f3f5;
    }

    .section-summary {
      display: none;
      align-items: center;
      gap: 6px;
      width: fit-content;
      max-width: 100%;
      padding: 5px 8px;
      color: #465163;
      background: #f7f9fb;
      border: 1px solid #edf1f5;
      border-radius: 7px;
      font-size: 12.3px;
      line-height: 1.35;
      animation: chipIn 180ms ease both;
    }

    .step-section.collapsed .section-desc,
    .step-section.collapsed .step-chips {
      display: none;
    }

    .step-section.collapsed .section-summary {
      display: inline-flex;
    }

    .process-step.compacted .step-copy>p,
    .process-step.compacted>.step-copy>.step-chips {
      display: none;
    }

    .file-card.pending {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    .file-card.ready {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      transition: opacity 260ms ease, transform 260ms ease, border-color 180ms ease, background 180ms ease;
    }

    .output-file {
      justify-self: start;
      margin: 0;
    }

    .file-card {
      margin-top: 0;
      display: inline-block;
      vertical-align: top;
      white-space: normal;
      line-height: normal;
      animation: rise 320ms ease both;
    }

    .file-card.output-file {
      margin: 0;
    }

    .file-body {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      width: min(292px, 100%);
      padding: 9px;
    }

    .file-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: var(--blue);
      background: #edf4ff;
      font-weight: 900;
      font-size: 10px;
    }

    .file-main strong {
      display: block;
      margin-bottom: 2px;
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-main p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-composer-wrap {
      position: relative;
      bottom: 0;
      padding: 10px 0 18px;
      background: linear-gradient(180deg, rgba(247, 248, 251, 0), var(--bg) 32%);
    }

    .preview-panel {
      display: none;
      position: sticky;
      top: 0;
      height: 100vh;
      background: rgba(255, 255, 255, 0.92);
      border: 0;
      border-radius: 0;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .chat-view.preview-open .preview-panel,
    .chat-view.preview-closing .preview-panel,
    .reports-view.preview-open .preview-panel,
    .reports-view.preview-closing .preview-panel {
      display: flex;
      flex-direction: column;
      will-change: transform, opacity;
    }

    .chat-view.preview-open .preview-panel,
    .reports-view.preview-open .preview-panel {
      animation: previewIn 280ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .chat-view.preview-closing .preview-panel,
    .reports-view.preview-closing .preview-panel {
      animation: previewOut 240ms cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .preview-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--soft);
    }

    .preview-kicker {
      display: block;
      margin-bottom: 5px;
      color: var(--faint);
      font-size: 12px;
      font-weight: 800;
    }

    .preview-head strong {
      display: block;
      font-size: 15px;
      line-height: 1.45;
    }

    .preview-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #ffffff;
      font-size: 18px;
      line-height: 1;
      text-decoration: none;
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-btn:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .preview-body {
      flex: 1;
      overflow: auto;
      background: #ffffff;
    }

    .preview-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .search-results-body {
      padding: 12px;
      overflow: auto;
      background: #fbfcfe;
    }

    .search-status {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      margin: -12px -12px 10px;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(221, 228, 236, 0.86);
      color: #4f5b6d;
      background: rgba(251, 252, 254, 0.94);
      backdrop-filter: blur(14px);
      font-size: 12px;
      line-height: 1.3;
    }

    .search-status-main {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 8px;
      font-weight: 750;
    }

    .search-status-main::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: #2f6fed;
      box-shadow: 0 0 0 4px rgba(47, 111, 237, 0.12);
      animation: pulseDot 880ms ease-in-out infinite;
    }

    .search-status.is-complete .search-status-main::before {
      background: #25a36f;
      box-shadow: 0 0 0 4px rgba(37, 163, 111, 0.12);
      animation: none;
    }

    .search-results {
      display: grid;
      gap: 0;
      border-top: 1px solid rgba(221, 228, 236, 0.72);
    }

    .search-result-card {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      align-items: start;
      gap: 8px;
      min-height: 58px;
      padding: 9px 16px;
      border: 0;
      border-bottom: 1px solid rgba(221, 228, 236, 0.72);
      border-radius: 0;
      color: inherit;
      background: transparent;
      box-shadow: none;
      text-decoration: none;
      transition: background 180ms ease;
      animation: resultIn 260ms ease both;
    }

    .search-result-card::before {
      display: none;
    }

    .search-result-card:hover {
      background: #f7faff;
    }

    .search-result-favicon {
      position: relative;
      z-index: 1;
      width: 16px;
      height: 16px;
      margin-top: 1px;
      border-radius: 4px;
      object-fit: contain;
      background: #ffffff;
    }

    .search-result-fallback {
      position: relative;
      z-index: 1;
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      margin-top: 1px;
      border-radius: 4px;
      color: #245ecb;
      background: rgba(47, 111, 237, 0.09);
      font-size: 9px;
      font-weight: 900;
    }

    .search-result-main {
      position: relative;
      z-index: 1;
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .search-result-card strong {
      color: #18202d;
      font-size: 13.2px;
      line-height: 1.34;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-result-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12.2px;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes pulseDot {

      0%,
      100% {
        transform: scale(0.92);
        opacity: 0.65;
      }

      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .step-chip.search-link {
      cursor: pointer;
    }

    .step-chip.search-link:hover {
      color: #245ecb;
      background: #e8f1ff;
    }

    .chat-composer {
      width: min(var(--chat-track-width), calc(100% - var(--page-gutter) - var(--page-gutter)));
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 7px;
      padding: 10px 10px 8px 14px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 12px 34px rgba(19, 28, 44, 0.06);
    }

    .chat-composer textarea {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      max-height: 160px;
      resize: none;
      border: 0;
      outline: 0;
      line-height: 1.55;
      color: var(--ink);
      padding: 6px 0 2px;
      background: transparent;
    }

    .chat-composer-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      min-height: 23px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--faint);
      animation: typing 1.1s ease-in-out infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 150ms;
    }

    .typing span:nth-child(3) {
      animation-delay: 300ms;
    }

    @keyframes viewIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes typing {

      0%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(47, 111, 237, 0.34);
      }

      50% {
        box-shadow: 0 0 0 9px rgba(47, 111, 237, 0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes stepIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes previewIn {
      from {
        opacity: 0;
        transform: translateX(48px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes previewOut {
      from {
        opacity: 1;
        transform: translateX(0);
      }

      to {
        opacity: 0;
        transform: translateX(48px);
      }
    }

    @keyframes resultIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes chipIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 1680px) {
      :root {
        --home-max: 980px;
        --chat-track-width: 760px;
        --chat-max: var(--chat-track-width);
        --chat-preview-max: var(--chat-track-width);
        --composer-width: var(--chat-track-width);
        --preview-width: clamp(620px, 42vw, 960px);
      }
    }

    @media (max-width: 1280px) {
      :root {
        --home-max: 860px;
        --chat-track-width: 720px;
        --chat-max: var(--chat-track-width);
        --chat-preview-max: var(--chat-track-width);
        --composer-width: var(--chat-track-width);
        --preview-width: clamp(460px, 40vw, 680px);
      }

      h1 {
        font-size: clamp(36px, 5vw, 56px);
      }

      .lead {
        font-size: clamp(18px, 2.2vw, 26px);
      }
    }

    @media (max-width: 1080px) {
      body:not(.sidebar-collapsed) {
        --sidebar-width: 224px;
        --sidebar-pad: 12px;
      }

      .app-sidebar {

## 二、合作条款与关键机制设计

### 1. 资金安排条款：资金融通与权利金优化

为解决贸易商大批量建库的资金压力，条款设计应着重于降低初期资本占用，并优化资金成本。

* **方案 A：现货回购 + 看涨期权（库存变现模式）**
* **条款设计**：贸易商以当前低价采购现货，并将其“销售”给我司（或合作金融机构），释放 80%–90% 的流动资金。同时，贸易商支付少量权利金向我司买入一笔**场外看涨期权（Call Option）**。
* **效果**：贸易商既锁定了未来以低价“赎回”现货的权利（保留安全垫），又释放了大量现金流。

* **方案 B：预付货款 + 累计购入结构（Accumulator 条款）**

* **效果**：平摊建仓成本，极其适合“左侧交易”建库。

### 2. 仓储物流与交割条款：期现转换（EFP）与弹性流向

“安全垫”的核心在于发生供应中断时能切切实实拿到现货。因此，物流条款必须具备高度的弹性和物理控制力。

* **静态仓单与动态置换条款**：
* 质押在我司指定交割库（或大型第三方物流枢纽）的粮食，其所有权在期权存续期内受法律保护。
* 允许贸易商进行“品质/库区动态置换”（在总价值或总量不变的前提下，允许因周转需要更换库容或粮食批次），保证粮食作为战略库存的鲜度。

* **弹性行权与实物交割（Physical Delivery Options）**：

* 若市价暴涨或供应中断触发，贸易商选择**实物行权**，我司配合快速释放仓单，转为物理实体库存，直接投入其加工或贸易链条。

* **设置价差保护带（Collar 领口结构）**：

* **设置安全垫阈值**：当现货价格上涨时，贸易商持有的看涨期权增值，可部分抵消其在其他渠道的现货采购成本；若价格下跌，则通过其现货底补仓，避免单边爆仓风险。

      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;

    function getFileExt(name) {

    function isSupportedUpload(file) {

    function getFileIconLabel(file) {

      if (["jpg", "jpeg"].includes(ext)) return "JPG";
      if (["png", "webp", "gif", "bmp", "heic", "heif"].includes(ext)) return ext.toUpperCase().slice(0, 4);
      if (["doc", "docx"].includes(ext)) return "DOC";
      if (["xls", "xlsx", "csv"].includes(ext)) return "XLS";
      if (["ppt", "pptx"].includes(ext)) return "PPT";
      if (["txt", "md", "rtf"].includes(ext)) return "TXT";
      return ext ? ext.toUpperCase().slice(0, 4) : "FILE";
    }

    function getFileIconClass(file) {
      const ext = getFileExt(file.name || "");
      if (ext === "pdf") return "is-pdf";
      if (["doc", "docx"].includes(ext)) return "is-doc";
      if (["xls", "xlsx", "csv"].includes(ext)) return "is-sheet";
      if (["ppt", "pptx"].includes(ext)) return "is-slide";
      if (["png", "jpg", "jpeg", "webp", "gif", "bmp", "heic", "heif"].includes(ext) || String(file.type || "").startsWith("image/")) return "is-image";
      if (["txt", "md", "rtf"].includes(ext)) return "is-text";
      return "is-text";
    }

    function renderInlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
        .replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^\*])\*([^\*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
    }

    function renderMarkdownTable(rows) {
      const cleanRows = rows
        .map((row) => row.trim())
        .filter((row) => row && !/^\|\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(row))
        .map((row) => row.replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim()));
      if (!cleanRows.length) return "";
      const [head, ...body] = cleanRows;
      return `
        <div class="result-table-wrap">
          <table>
            <thead>
              <tr>${head.map((cell) => `<th>${renderInlineMarkdown(cell)}</th>`).join("")}</tr>
            </thead>
            <tbody>
              ${body.map((row) => `<tr>${row.map((cell) => `<td>${renderInlineMarkdown(cell)}</td>`).join("")}</tr>`).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function markdownToBlocks(content) {
      const lines = content.split("\n");
      const blocks = [];
      let listItems = [];
      let tableRows = [];
      let paragraphLines = [];

      const flushList = () => {
        if (!listItems.length) return;
        blocks.push(`<ul>${listItems.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join("")}</ul>`);
        listItems = [];
      };

      const flushTable = () => {
        if (!tableRows.length) return;
        blocks.push(renderMarkdownTable(tableRows));
        tableRows = [];
      };

      const flushParagraph = () => {
        if (!paragraphLines.length) return;
        blocks.push(`<p>${renderInlineMarkdown(paragraphLines.join(" "))}</p>`);
        paragraphLines = [];
      };

      lines.forEach((line) => {
        const trimmed = line.trim();
        if (!trimmed) {
          flushParagraph();
          flushList();
          flushTable();
          return;
        }
        if (/^\|.*\|$/.test(trimmed)) {
          flushParagraph();
          flushList();
          tableRows.push(trimmed);
          return;
        }
        flushTable();
        if (/^-{3,}$/.test(trimmed)) {
          flushParagraph();
          flushList();
          blocks.push("<hr>");
          return;
        }
        if (trimmed.startsWith("### ")) {
          flushParagraph();
          flushList();
          blocks.push(`<h3>${renderInlineMarkdown(trimmed.slice(4))}</h3>`);
          return;
        }
        if (trimmed.startsWith("## ")) {
          flushParagraph();
          flushList();
          blocks.push(`<h2>${renderInlineMarkdown(trimmed.slice(3))}</h2>`);
          return;
        }
        if (trimmed.startsWith("# ")) {
          flushParagraph();
          flushList();
          blocks.push(`<h2>${renderInlineMarkdown(trimmed.slice(2))}</h2>`);
          return;
        }
        const bulletMatch = trimmed.match(/^[-*]\s+(.+)$/);
        const orderedMatch = trimmed.match(/^\d+\.\s+(.+)$/);
        if (bulletMatch || orderedMatch) {
          flushParagraph();
          listItems.push((bulletMatch || orderedMatch)[1]);
          return;
        }
        flushList();
        paragraphLines.push(trimmed);
      });
      flushParagraph();
      flushList();
      flushTable();
      return blocks;
    }

    function markdownToHtml(content) {
      return markdownToBlocks(content).join("");
    }

    async function streamMarkdownBlocks(target, content, runId) {
      target.innerHTML = "";
      const blocks = markdownToBlocks(content);
      for (let i = 0; i < blocks.length; i += 1) {
        if (activeRunId !== runId) return false;
        target.insertAdjacentHTML("beforeend", blocks[i]);
        scrollToBottom();
        const textLength = blocks[i].replace(/<[^>]*>/g, "").length;
        await sleep(Math.min(420, Math.max(120, textLength * 5)));
      }
      return true;
    }

    function ensureSeedHistory() {
      const seeds = [

        { seedKey: "seed-case-2", scenarioKey: "rainfall", data: placeholderCase2 }
      ];
      let changed = false;
      const seedRecords = seeds.map((seed) => {
        const existing = conversationHistory.find((item) => item.seedKey === seed.seedKey);
        const record = {
          question: seed.data.question,
          scenarioKey: seed.scenarioKey,
          title: existing?.title || seed.data.fileTitle,
          favorite: Boolean(existing?.favorite),
          messagesHtml: buildStoredMessagesHtml(seed.data),
          reportTitle: "",
          reportMeta: "",
          reportTime: "",
          seedKey: seed.seedKey,
          seedVersion: SEED_SNAPSHOT_VERSION
        };
        if (!existing || existing.seedVersion !== SEED_SNAPSHOT_VERSION || !existing.messagesHtml.includes("process-card")) {
          changed = true;
          return record;
        }
        return existing;
      });
      const otherRecords = conversationHistory.filter((item) => !seeds.some((seed) => seed.seedKey === item.seedKey));
      const hadAllSeeds = seeds.every((seed) => conversationHistory.some((item) => item.seedKey === seed.seedKey));
      if (!changed && hadAllSeeds) return;
      conversationHistory = [...seedRecords, ...otherRecords].slice(0, 8);
      persistHistory();
    }

      closeHistoryMenus();
      title.innerHTML = `<input class="history-title-input" data-history-title-input type="text" value="${escapeHtml(getHistoryTitle(record))}" aria-label="重命名对话">`;
      const input = title.querySelector("[data-history-title-input]");
      input.focus();
      input.select();
      input.addEventListener("click", (event) => event.stopPropagation());
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          finishInlineRename(row, index, true);
        }
        if (event.key === "Escape") {
          event.preventDefault();
          finishInlineRename(row, index, false);
        }
      });
      input.addEventListener("blur", () => finishInlineRename(row, index, true));

              <circle cx="12" cy="19" r="1"></circle>
            </svg>
          </button>
          <div class="history-menu" role="menu">
            <button type="button" data-history-action="rename">重命名</button>
            <button type="button" data-history-action="favorite" aria-disabled="true" title="当前版本暂未开放">${item.favorite ? "取消收藏" : "收藏"}</button>

          </div>

      historySection.classList.toggle("has-history", visibleHistory.length > 0);
      renderReports();
    }

    function renderReports() {
      const reports = buildReportCatalog();
      const query = reportsSearch.value.trim().toLowerCase();
      const visibleReports = reports.filter((item) => {
        const searchable = `${item.project || ""} ${item.title || ""} ${item.meta || ""} ${item.time || ""}`.toLowerCase();
        return !query || searchable.includes(query);
      });
      if (!visibleReports.some((item) => item.id === activeReportIndex)) {
        activeReportIndex = visibleReports[0]?.id || "";
      }
      reportsCount.textContent = `${visibleReports.length} 个研判报告`;
      const groups = visibleReports.reduce((acc, item) => {
        const project = item.project || "未命名研判";
        if (!acc.has(project)) acc.set(project, []);
        acc.get(project).push(item);
        return acc;
      }, new Map());
      reportsGrid.innerHTML = Array.from(groups.entries()).map(([project, items]) => `
        <section class="report-group">
          <div class="report-group-title">
            <strong>${escapeHtml(project)}</strong>
          </div>
          <div class="report-group-files">
            ${items.map((item) => {
        const typeClass = String(item.meta).toUpperCase().includes("PDF") ? " is-pdf" : "";
        return `
                <button class="report-card${item.id === activeReportIndex ? " is-active" : ""}" type="button" data-report-id="${escapeHtml(item.id)}" title="${escapeHtml(item.title)}">
                  <span class="report-type${typeClass}">${escapeHtml(getReportIcon(item.meta))}</span>
                  <span class="report-copy">
                    <span class="report-title">${escapeHtml(item.title)}</span>
                    <span class="report-meta">
                      <span>${escapeHtml(item.meta)}</span>
                    </span>
                    <span class="report-time">${escapeHtml(item.time || "刚刚")}</span>
                  </span>
                </button>
              `;
      }).join("")}
          </div>
        </section>
      `).join("");
      reportsLimit.textContent = "";
      reportsEmpty.textContent = query ? "没有匹配的报告" : "暂无报告";
      reportsBoard.classList.toggle("has-reports", visibleReports.length > 0);
    }

    function openReportsPreviewPanel(id) {
      const report = buildReportCatalog().find((item) => item.id === id);
      if (!report) return;
      activeReportIndex = id;
      reportsPanelTitle.textContent = report.title;
      reportsPanelDownload.setAttribute("href", report.fileHref || DEFAULT_REPORT_FILE);
      reportsPanelBody.className = "preview-body";
      reportsPanelBody.innerHTML = `<iframe class="preview-frame" src="${escapeHtml(report.previewHref || DEFAULT_REPORT_PREVIEW)}" title="报告预览"></iframe>`;
      reportsPreview.setAttribute("aria-hidden", "false");
      reportsView.classList.remove("preview-closing");
      reportsView.classList.add("preview-open");
      renderReports();
    }

    function closeReportsPreview(immediate = false) {
      if (immediate) {
        reportsView.classList.remove("preview-open", "preview-closing");
        reportsPreview.setAttribute("aria-hidden", "true");
        return;
      }
      if (!reportsView.classList.contains("preview-open")) {
        reportsView.classList.remove("preview-closing");
        reportsPreview.setAttribute("aria-hidden", "true");
        return;
      }
      reportsView.classList.remove("preview-open");
      reportsView.classList.add("preview-closing");
      setTimeout(() => {
        reportsView.classList.remove("preview-closing");
        reportsPreview.setAttribute("aria-hidden", "true");
      }, 260);
    }

    function addHistoryEntry(question, scenarioKey) {
      const existing = conversationHistory.find((item) => item.question === question);
      conversationHistory = conversationHistory.filter((item) => item.question !== question);
      conversationHistory.unshift({
        question,
        scenarioKey,
        title: existing?.title || "",
        favorite: Boolean(existing?.favorite),
        messagesHtml: stripReportArtifacts(existing?.messagesHtml || ""),
        reportTitle: "",
        reportMeta: "",
        reportTime: "",
        seedKey: existing?.seedKey || "",
        seedVersion: Number(existing?.seedVersion || 0)
      });
      conversationHistory = conversationHistory.slice(0, 8);
      persistHistory();
      renderHistory();
    }

    function saveHistorySnapshot(question) {
      const index = conversationHistory.findIndex((item) => item.question === question);
      if (index < 0) return;
      const snapshot = messages.cloneNode(true);
      snapshot.querySelectorAll("[data-live-process]").forEach((node) => node.removeAttribute("data-live-process"));
      snapshot.querySelectorAll("[data-preview-report], [data-live-file]").forEach((node) => node.remove());
      conversationHistory[index] = {
        ...conversationHistory[index],
        messagesHtml: snapshot.innerHTML,
        reportTitle: "",
        reportMeta: "",
        reportTime: ""
      };
      persistHistory();
      renderHistory();
    }

    function showReports() {

      chatView.classList.remove("active");
      homeView.classList.remove("active");
      reportsView.classList.add("active");
      clearAttachments("home");

      questionInput.value = "";
