<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="智链大模型 Demo">
  <title>智链大模型 · 数智创新</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --bg: #fbfcfe;
      --panel: #ffffff;
      --ink: #141922;
      --muted: #657083;
      --faint: #96a0af;
      --line: #dde4ec;
      --soft: #eef3f7;
      --blue: #2f6fed;
      --teal: #0f9b8e;
      --amber: #d88913;
      --red: #d84a3a;
      --shadow: 0 18px 48px rgba(19, 28, 44, 0.07);
      --radius: 8px;
      --sidebar-width: 252px;
    }

    body.sidebar-collapsed {
      --sidebar-width: 72px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 42%, #f4f7fb 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      width: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 14px;
      background: rgba(255, 255, 255, 0.88);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(18px);
      transition: width 220ms ease, padding 220ms ease;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 38px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      width: 168px;
      overflow: hidden;
      border: 0;
      background: transparent;
      border-radius: 0;
      padding: 0;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .brand:hover {
      opacity: 0.84;
      transform: translateY(-1px);
    }

    .brand-logo {
      width: 168px;
      height: auto;
      display: block;
      flex: 0 0 auto;
    }

    .sidebar-icon-button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease;
    }

    .sidebar-icon-button:hover {
      color: var(--ink);
      background: #f4f7fb;
      border-color: var(--line);
    }

    .sidebar-icon-button svg,
    .sidebar-action svg,
    .history-item svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
    }

    .sidebar-action {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #243043;
      background: #ffffff;
      font-size: 13px;
      font-weight: 800;
      text-align: left;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .sidebar-action:hover {
      background: #f8fafc;
      border-color: rgba(47, 111, 237, 0.28);
      transform: translateY(-1px);
    }

    .sidebar-section {
      display: grid;
      gap: 8px;
      min-height: 0;
    }

    .history-section {
      flex: 1;
    }

    .sidebar-label {
      padding: 4px 6px;
      color: var(--faint);
      font-size: 12px;
      font-weight: 800;
    }

    .history-list {
      display: grid;
      gap: 4px;
      overflow: auto;
      padding-right: 2px;
    }

    .history-item {
      width: 100%;
      min-height: 36px;
      display: grid;
      grid-template-columns: 17px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 8px 9px;
      border: 0;
      border-radius: 9px;
      color: #4f5b6d;
      background: transparent;
      font-size: 12.5px;
      line-height: 1.35;
      text-align: left;
    }

    .history-item:hover {
      color: var(--ink);
      background: #f4f7fb;
    }

    .history-title {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-empty {
      padding: 8px 7px;
      color: var(--faint);
      font-size: 12.5px;
      line-height: 1.45;
    }

    .sidebar-collapsed .app-sidebar {
      padding: 18px 12px;
    }

    .sidebar-collapsed .brand {
      width: 38px;
    }

    .sidebar-collapsed .sidebar-head {
      flex-direction: column;
      align-items: center;
    }

    .sidebar-collapsed .sidebar-action {
      justify-content: center;
      padding: 9px;
    }

    .sidebar-collapsed .sidebar-text,
    .sidebar-collapsed .sidebar-label,
    .sidebar-collapsed .history-list,
    .sidebar-collapsed .history-empty {
      display: none;
    }

    .view {
      display: none;
      animation: viewIn 240ms ease both;
    }

    .view.active {
      display: block;
    }

    .home.view.active {
      display: flex;
    }

    .home {
      width: min(920px, calc(100% - var(--sidebar-width) - 40px));
      margin: 0 auto;
      min-height: 100vh;
      padding: 0 0 48px;
      flex-direction: column;
      justify-content: center;
      transform: translateX(calc(var(--sidebar-width) / 2));
      transition: transform 220ms ease;
    }

    .home-hero {
      text-align: center;
    }

    .eyebrow {
      display: none;
    }

    h1 {
      max-width: 720px;
      margin: 0 auto 18px;
      font-size: clamp(40px, 5.4vw, 64px);
      line-height: 1.08;
      letter-spacing: 0;
      color: #0570f7;
      font-weight: 850;
    }

    .lead {
      display: block;
      margin: 0 auto 48px;
      color: #222936;
      font-size: clamp(20px, 2.2vw, 30px);
      font-weight: 500;
      line-height: 1.45;
    }

    .composer {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .composer textarea {
      width: 100%;
      min-height: 132px;
      resize: none;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      line-height: 1.65;
      font-size: 15px;
    }

    .composer textarea::placeholder {
      color: #98a3b2;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      border-top: 0;
      padding-top: 8px;
    }

    .hint {
      display: none;
    }

    .send-button {
      width: 42px;
      height: 42px;
      min-width: 42px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      border: 0;
      border-radius: 11px;
      color: #ffffff;
      background: var(--blue);
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .send-button:hover {
      background: #245ecb;
      transform: translateY(-1px);
    }

    .send-button:disabled {
      color: #8f99a8;
      background: #eef1f5;
      cursor: not-allowed;
      transform: none;
    }

    .send-button svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
    }

    .primary-btn,
    .ghost-btn {
      min-height: 40px;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 800;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .primary-btn {
      border: 0;
      color: #ffffff;
      background: var(--blue);
    }

    .primary-btn:hover {
      background: #245ecb;
      transform: translateY(-1px);
    }

    .primary-btn:disabled {
      background: #bac4d1;
      cursor: not-allowed;
      transform: none;
    }

    .ghost-btn {
      border: 1px solid rgba(47, 111, 237, 0.24);
      color: var(--blue);
      background: #ffffff;
    }

    .trend-section {
      width: 100%;
      margin: 34px auto 0;
    }

    .section-head {
      display: block;
      margin-bottom: 14px;
    }

    .section-head h2 {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .section-head::after {
      content: "";
      display: block;
      margin-top: 8px;
      height: 1px;
      width: 100%;
      background: var(--line);
    }

    .section-head p {
      display: none;
    }

    .trend-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .trend-card {
      position: relative;
      overflow: hidden;
      min-height: 126px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      padding: 17px;
      text-align: left;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(248, 251, 255, 0.84));
      border: 1px solid rgba(221, 228, 236, 0.86);
      border-radius: 14px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .trend-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(47, 111, 237, 0.08), transparent 42%);
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .trend-card:hover {
      transform: translateY(-3px);
      border-color: rgba(47, 111, 237, 0.45);
      box-shadow: 0 18px 38px rgba(19, 28, 44, 0.08);
      background: #ffffff;
    }

    .trend-card:hover::before {
      opacity: 1;
    }

    .tag-row {
      display: none;
    }

    .tag {
      color: #374151;
      background: var(--soft);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
    }

    .trend-card h3 {
      margin: 0;
      font-size: 14.5px;
      line-height: 1.45;
      letter-spacing: 0;
      position: relative;
      z-index: 1;
    }

    .trend-card p {
      display: none;
    }

    .card-action {
      color: var(--faint);
      font-size: 16px;
      line-height: 1;
      font-weight: 800;
      position: relative;
      z-index: 1;
    }

    .chat-view {
      min-height: 100vh;
      margin-left: var(--sidebar-width);
      width: calc(100% - var(--sidebar-width));
      transition: margin-left 220ms ease, width 220ms ease;
    }

    .chat-view.active {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }

    .chat-view.preview-open,
    .chat-view.preview-closing {
      grid-template-columns: minmax(0, 1fr) minmax(360px, 44%);
      gap: 0;
    }

    .chat-view.preview-open .chat-shell,
    .chat-view.preview-closing .chat-shell {
      padding-left: 0;
      border-right: 1px solid var(--line);
    }

    .chat-view.preview-open .messages,
    .chat-view.preview-closing .messages {
      width: min(640px, calc(100% - 34px));
    }

    .chat-view.preview-open .chat-composer,
    .chat-view.preview-closing .chat-composer {
      width: min(640px, calc(100% - 34px));
    }

    .chat-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    .messages {
      width: min(900px, calc(100% - 34px));
      margin: 0 auto;
      padding: 34px 0 22px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .message {
      display: flex;
      animation: rise 320ms ease both;
    }

    .message.user {
      justify-content: flex-end;
    }

    .assistant-output {
      width: min(760px, 100%);
      max-width: min(760px, 100%);
      display: grid;
      gap: 10px;
    }

    .bubble {
      max-width: min(760px, 100%);
      padding: 14px 17px;
      border-radius: 8px;
      line-height: 1.62;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .user .bubble {
      color: #ffffff;
      background: var(--blue);
    }

    .assistant .bubble {
      background: #ffffff;
      border: 1px solid var(--line);
      box-shadow: 0 10px 28px rgba(19, 28, 44, 0.04);
    }

    .result-bubble {
      display: grid;
      gap: 0;
    }

    .result-text {
      display: grid;
      gap: 10px;
      white-space: normal;
    }

    .result-text p {
      margin: 0;
      line-height: 1.68;
    }

    .process-card {
      width: min(760px, 100%);
      max-width: 760px;
      min-height: 0;
      padding: 16px 18px 2px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      animation: rise 320ms ease both;
    }

    .file-card {
      width: fit-content;
      max-width: min(520px, 100%);
      overflow: hidden;
      padding: 0;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: none;
      color: inherit;
      cursor: pointer;
      text-align: left;
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .file-card:hover {
      background: #ffffff;
      border-color: rgba(47, 111, 237, 0.36);
      transform: translateY(-1px);
    }

    .process-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 0 14px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      font-size: 13.5px;
      text-align: left;
      cursor: pointer;
    }

    .chevron {
      width: 16px;
      height: 16px;
      display: inline-grid;
      place-items: center;
      color: var(--faint);
      transition: transform 180ms ease;
    }

    .process-card.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .process-list {
      position: relative;
      padding: 0 0 2px 34px;
      display: grid;
      gap: 0;
    }

    .process-card.collapsed .process-list {
      display: none;
    }

    .process-card:not(.planned) {
      padding-bottom: 16px;
    }

    .process-card:not(.planned) .process-toggle {
      padding-bottom: 0;
    }

    .process-card:not(.planned) .process-list {
      display: none;
    }

    .process-card.planning-card .process-list {
      padding-left: 0;
    }

    .process-card.planning-card .process-list::before {
      display: none;
    }

    .process-list::before {
      content: "";
      position: absolute;
      top: 13px;
      bottom: 13px;
      left: 11px;
      width: 1px;
      background: repeating-linear-gradient(
        to bottom,
        #d8dee7 0,
        #d8dee7 5px,
        transparent 5px,
        transparent 10px
      );
    }

    .process-step {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 0 0 22px;
      opacity: 1;
      transition: opacity 200ms ease;
      animation: stepIn 260ms ease both;
    }

    .process-step.active {
      opacity: 1;
    }

    .process-step.done {
      opacity: 1;
    }

    .planning-step {
      padding: 0 0 16px;
    }

    .planning-step .step-dot {
      display: none;
    }

    .planning-step .step-copy {
      display: grid;
      gap: 10px;
    }

    .planning-spinner {
      width: 9px;
      height: 9px;
      border: 1.5px solid var(--blue);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }

    .process-card.planned .process-toggle .planning-spinner {
      border-color: var(--teal);
      background: var(--teal);
      animation: none;
      box-shadow: inset 0 0 0 2px #ffffff;
    }

    .planning-nodes {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      max-width: 520px;
      padding-left: 30px;
    }

    .planning-nodes::before {
      content: "";
      position: absolute;
      top: 9px;
      bottom: 9px;
      left: 9px;
      width: 1px;
      background: #d8dee7;
    }

    .plan-node {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #647084;
      font-size: 12.3px;
      line-height: 1.35;
      opacity: 1;
      transform: translateY(0);
      transition: color 180ms ease, opacity 180ms ease, transform 180ms ease;
    }

    .plan-node.queued {
      opacity: 0;
      transform: translateY(4px);
    }

    .plan-node.loading {
      color: #245ecb;
    }

    .plan-node.done {
      color: #3f4a5c;
    }

    .plan-index {
      position: absolute;
      left: -30px;
      top: -1px;
      width: 19px;
      height: 19px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      color: #647084;
      background: #ffffff;
      border: 1px solid #d8dee7;
      font-size: 10px;
      font-weight: 800;
    }

    .plan-node.loading .plan-index,
    .plan-node.done .plan-index {
      color: #ffffff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .plan-node.done .plan-index {
      background: var(--teal);
      border-color: var(--teal);
    }

    .plan-title {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .step-dot {
      position: absolute;
      left: -32px;
      top: 2px;
      width: 19px;
      height: 19px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--muted);
      background: #ffffff;
      border: 1px solid #d8dee7;
      font-size: 10px;
      font-weight: 800;
    }

    .active .step-dot {
      color: #ffffff;
      background: var(--blue);
      border-color: var(--blue);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .done .step-dot {
      color: #ffffff;
      background: var(--teal);
      border-color: var(--teal);
      animation: none;
    }

    .step-copy strong {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      color: #1b2430;
      font-size: 14.5px;
      line-height: 1.45;
    }

    .step-title-icon,
    .chip-icon {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      color: currentColor;
    }

    .step-title-icon {
      width: 15px;
      height: 15px;
      color: var(--blue);
    }

    .chip-icon {
      width: 13px;
      height: 13px;
    }

    .step-title-icon svg,
    .chip-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
    }

    .step-copy p {
      margin: 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.68;
    }

    .step-copy p:empty {
      display: none;
    }

    .step-chips {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      align-items: start;
      padding-top: 1px;
    }

    .step-sections {
      display: grid;
      gap: 8px;
      padding-top: 5px;
    }

    .step-section {
      display: grid;
      gap: 6px;
      padding: 7px 0 9px;
      border: 0;
      border-top: 1px solid #edf1f5;
      background: transparent;
      transition: opacity 180ms ease;
    }

    .step-section:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .step-section.agent-section {
      background: transparent;
    }

    .section-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #273142;
      font-size: 12.8px;
      font-weight: 750;
      line-height: 1.35;
      text-align: left;
      cursor: pointer;
    }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .section-actions {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
      flex: 0 0 auto;
    }

    .section-chevron {
      width: 14px;
      height: 14px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--faint);
      font-size: 12px;
      transition: transform 160ms ease;
    }

    .step-section.collapsed .section-chevron {
      transform: rotate(-90deg);
    }

    .agent-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 230px;
      min-width: 0;
      padding: 4px 7px;
      border: 1px solid #dce8ff;
      border-radius: 7px;
      color: #245ecb;
      background: #f4f8ff;
    }

    .agent-tag .agent-mark {
      width: 16px;
      height: 16px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      color: #2f6fed;
    }

    .agent-tag .agent-mark svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }

    .agent-tag .agent-name {
      color: #1f54b7;
      font-size: 11.5px;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-desc {
      margin: 0;
      color: var(--muted);
      font-size: 12.2px;
      line-height: 1.5;
    }

    .step-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      max-width: 100%;

    async function typeText(target, content, runId, speed = 18) {
      target.textContent = "";
      for (let i = 0; i < content.length; i += 1) {
        if (activeRunId !== runId) return false;
        target.textContent += content[i];
        if (i % 3 === 0) scrollToBottom();
        const char = content[i];
        await sleep(char === "\n" ? 220 : /[。；，、]/.test(char) ? speed * 5 : speed);
      }
      scrollToBottom();
      return true;
    }

    async function typeParagraphs(target, content, runId, speed = 14) {
      target.innerHTML = "";
      const paragraphs = content.split("\n").filter(Boolean);
      for (let i = 0; i < paragraphs.length; i += 1) {
        if (activeRunId !== runId) return false;
        const paragraph = document.createElement("p");
        target.appendChild(paragraph);
        const complete = await typeText(paragraph, paragraphs[i], runId, speed);
        if (!complete) return false;
        if (i < paragraphs.length - 1) await sleep(180);
      }
      return true;
    }

      return bubble;
    }

      return `
        <div class="step-section${isAgent ? " agent-section" : ""}">
          <button class="section-toggle" type="button" data-section-toggle>
            <span class="section-title">
              ${stepTitleIcon(section.icon)}
              ${escapeHtml(section.title)}
            </span>
            <span class="section-actions">
              ${isAgent ? `
                <span class="agent-tag">
                  <span class="agent-mark">${iconSvg("agent")}</span>
                  <span class="agent-name">${escapeHtml(section.agentName)}</span>
                </span>
              ` : ""}
              <span class="section-chevron">⌄</span>
            </span>
          </button>
          <p class="section-desc">${escapeHtml(section.text)}</p>
          <div class="step-chips">
            ${section.chips.map((chip) => renderActionChip(chip, section.searchKey)).join("")}
          </div>
          <div class="section-summary">${chipIcon(isAgent ? "agent" : "shield")}${escapeHtml(section.summary || "已完成")}</div>
        </div>
      `;
    }

    function appendProcessStep(card, step, index) {
      const list = card.querySelector(".process-list");
      const el = document.createElement("div");
      el.className = "process-step active";
      el.dataset.step = index;
      el.dataset.summary = step.summary || `${step.title}已完成`;
      const sections = step.sections || [{
        title: step.title,
        icon: step.icon,
        text: step.text,
        summary: step.summary,
        chips: step.chips || []
      }];
      const inner = `<div class="step-sections">${sections.map(renderSection).join("")}</div>`;
      el.innerHTML = `
        <div class="step-dot">${index + 1}</div>
        <div class="step-copy">
          ${step.sections ? `<strong>${stepTitleIcon(step.icon)}${step.title}</strong><p>${step.text}</p>` : ""}
          ${inner}
        </div>
      `;
      list.appendChild(el);
      scrollToBottom();
      return el;
    }

    function compactProcessStep(stepEl) {
      if (stepEl.classList.contains("compacted")) return;
      stepEl.classList.add("compacted");
      const sections = stepEl.querySelectorAll(".step-section");
      if (sections.length) {
        sections.forEach((section) => section.classList.add("collapsed"));
        return;
      }
      const copy = stepEl.querySelector(".step-copy");
      const summary = document.createElement("div");
      summary.className = "step-summary";
      summary.innerHTML = `${chipIcon("shield")}${escapeHtml(stepEl.dataset.summary || "已完成")}`;
      copy.appendChild(summary);
    }

    function expandProcessStep(stepEl) {
      stepEl.classList.remove("compacted");
      stepEl.querySelector(".step-summary")?.remove();
      stepEl.querySelectorAll(".step-section.collapsed").forEach((section) => section.classList.remove("collapsed"));
    }

    async function revealProcessStep(stepEl, runId, timings) {
      const chips = Array.from(stepEl.querySelectorAll("[data-chip]"));
      for (let i = 0; i < chips.length; i += 1) {
        if (activeRunId !== runId) return false;
        const chip = chips[i];
        chip.classList.remove("queued");
        chip.classList.add("loading");
        scrollToBottom();
        await sleep(timings.chip[i] || timings.chip[0] || 520);
        chip.classList.remove("loading");
        chip.classList.add("done");
      }
      await sleep(timings.after || 260);
      return true;
    }

    async function showPlannedNodes(card, runId) {
      const planning = card.querySelector(".planning-step");
      if (!planning) return false;
      planning.querySelector(".planning-nodes").innerHTML = processSteps
        .map((step, index) => `<span class="plan-node queued" data-chip><span class="plan-index">${index + 1}</span><span class="plan-title">${escapeHtml(step.title)}</span></span>`)
        .join("");
      card.classList.add("planned");
      card.querySelector("[data-process-summary]").textContent = `已规划 ${processSteps.length} 个步骤`;
      const keepGoing = await revealProcessStep(planning, runId, {
        chip: [360, 420, 420, 380, 420, 360],
        after: 900
      });
      if (!keepGoing) return false;
      planning.classList.remove("active");
      planning.classList.add("done");
      planning.querySelector(".step-dot").textContent = "✓";
      return true;
    }

    function setProcessState(card, activeIndex) {
      card.querySelectorAll(".process-step").forEach((step, index) => {
        step.classList.toggle("active", index === activeIndex);
        step.classList.toggle("done", index < activeIndex);
        if (index < activeIndex) {
          compactProcessStep(step);
        } else if (index === activeIndex) {
          expandProcessStep(step);
        }
        const dot = step.querySelector(".step-dot");
        dot.textContent = index < activeIndex ? "✓" : index + 1;
      });
      if (activeIndex >= processSteps.length) {
        card.querySelector("[data-process-summary]").textContent = "执行流程已完成";
      }
    }

    function scrollToBottom() {
      if (suppressAutoScroll) return;
      requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }));
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function runAnalysis(scenarioKey, customQuestion, options = {}) {
      const runId = activeRunId + 1;
      activeRunId = runId;
      const baseData = scenarioData[scenarioKey] || scenarioData.custom;
      const data = { ...baseData, question: customQuestion || baseData.question };

      if (options.saveHistory !== false) {
        addHistoryEntry(data.question, scenarioKey);
      }
      showChat();
      addMessage("user", data.question);

      const assistantOutput = createAssistantTurn();
      const processCard = addProcessCard(assistantOutput);
      requestAnimationFrame(forcePageTop);
      await sleep(4200);
      if (activeRunId !== runId) return;
      suppressAutoScroll = false;
      const planned = await showPlannedNodes(processCard, runId);
      if (!planned || activeRunId !== runId) return;
      await sleep(1200);
      if (activeRunId !== runId) return;
      processCard.querySelector(".planning-step")?.remove();
      processCard.classList.remove("planning-card");
      processCard.querySelector("[data-process-summary]").textContent = "执行流程";

      for (let i = 0; i < processSteps.length; i += 1) {
        if (activeRunId !== runId) return;
        const stepEl = appendProcessStep(processCard, processSteps[i], i);
        setProcessState(processCard, i);
        const keepGoing = await revealProcessStep(stepEl, runId, processTimings[i] || { chip: [760], after: 420, pause: 220 });
        if (!keepGoing) return;
        setProcessState(processCard, i + 1);
        await sleep((processTimings[i] || { pause: 220 }).pause);
      }

      if (activeRunId !== runId) return;
      setProcessState(processCard, processSteps.length);
      await addResultBubble(assistantOutput, data, runId);
    }

    async function runFollowUp(question) {
      const runId = activeRunId + 1;
      activeRunId = runId;
      addMessage("user", question);

      const assistantOutput = createAssistantTurn();
      await sleep(360);
      if (activeRunId !== runId) return;
      await addAssistantBubble(assistantOutput, "目前这是 demo，暂不支持继续追问。", runId);
    }

    questionInput.addEventListener("input", () => {
      selectedScenarioKey = null;
      sendBtn.disabled = !questionInput.value.trim();
    });

    questionForm.addEventListener("submit", (event) => {
      event.preventDefault();
      event.submitter?.blur();
      const question = questionInput.value.trim();
      if (!question) return;
      runAnalysis(selectedScenarioKey || "custom", question);
    });

    document.querySelectorAll(".trend-card").forEach((card) => {
      card.addEventListener("click", () => {
        const scenario = scenarioData[card.dataset.scenario];
        if (!scenario) return;
        selectedScenarioKey = card.dataset.scenario;
        questionInput.value = scenario.question;
        sendBtn.disabled = false;
        questionInput.focus();
      });
    });

    chatInput.addEventListener("input", () => {
      chatSend.disabled = !chatInput.value.trim();
      chatInput.style.height = "auto";
      chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + "px";
    });

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const question = chatInput.value.trim();
      if (!question) return;
      chatInput.value = "";
      chatInput.style.height = "auto";
      chatSend.disabled = true;
      runFollowUp(question);
    });

    brandHome.addEventListener("click", showHome);
    newChatBtn.addEventListener("click", showHome);
    sidebarToggle.addEventListener("click", () => {
      const collapsed = document.body.classList.toggle("sidebar-collapsed");
      sidebarToggle.setAttribute("aria-label", collapsed ? "展开侧边栏" : "收起侧边栏");
    });
    historyList.addEventListener("click", (event) => {
      const item = event.target.closest("[data-history-index]");
      if (!item) return;
      const record = conversationHistory[Number(item.dataset.historyIndex)];
      if (!record) return;
      runAnalysis(record.scenarioKey || "custom", record.question, { saveHistory: false });
    });
    previewClose.addEventListener("click", closePreview);

    window.addEventListener("popstate", () => {
      if (location.hash !== "#chat") {
        activeRunId += 1;
        messages.innerHTML = "";
        closePreview(true);
        chatView.classList.remove("active");
        homeView.classList.add("active");
      }
    });

    if (location.hash === "#chat") {
      history.replaceState({ view: "home" }, "", location.pathname);
    }
    renderHistory();
  </script>


</body>
</html>
