<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="智链大模型 Demo">
  <title>智链大模型 · 数智创新</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --bg: #fbfcfe;
      --panel: #ffffff;
      --ink: #141922;
      --muted: #657083;
      --faint: #96a0af;
      --line: #dde4ec;
      --soft: #eef3f7;
      --blue: #2f6fed;
      --teal: #0f9b8e;
      --amber: #d88913;
      --red: #d84a3a;
      --shadow: 0 18px 48px rgba(19, 28, 44, 0.07);
      --radius: 8px;
      --sidebar-width: 252px;
      --ui-font-size: 13px;
      --body-font-size: 15px;
      --body-line: 1.68;
      --reading-line: 1.76;
      --turn-gap: 24px;
      --question-answer-gap: 18px;
      --answer-next-gap: 30px;
      --ai-block-gap: 14px;
      --ai-result-gap: 16px;
      --ai-file-gap: 8px;
      --page-gutter: clamp(18px, 2.4vw, 42px);
      --home-max: 940px;
      --chat-max: 900px;
      --chat-preview-max: 680px;
      --preview-width: clamp(380px, 36vw, 720px);
    }

    body.sidebar-collapsed {
      --sidebar-width: 72px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 42%, #f4f7fb 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
      line-height: 1.5;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      width: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px 14px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(18px);
      box-shadow: 10px 0 32px rgba(19, 28, 44, 0.035);
      transition: width 220ms ease, padding 220ms ease;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 44px;
      margin-bottom: 2px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      width: 168px;
      min-width: 168px;
      height: 60px;
      overflow: visible;
      border: 0;
      background: transparent;
      border-radius: 0;
      padding: 0;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .brand:hover {
      opacity: 0.84;
      transform: translateY(-1px);
    }

    .brand-logo {
      width: 168px;
      height: auto;
      display: block;
      flex: 0 0 auto;
      object-fit: contain;
    }

    .sidebar-icon-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #4f5b6d;
      background: transparent;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .sidebar-icon-button:hover,
    .sidebar-action:hover {
      color: var(--ink);
      background: #f8fafc;
      border-color: rgba(47, 111, 237, 0.28);
      transform: translateY(-1px);
    }

    .sidebar-icon-button svg,
    .sidebar-action svg,
    .sidebar-search-trigger svg,
    .sidebar-search-field svg,
    .history-main svg,
    .history-menu-button svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.9;
    }

    .sidebar-action,
    .sidebar-search-trigger,
    .sidebar-search-field {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: var(--ui-font-size);
      font-weight: 760;
      line-height: 1;
      text-align: left;
    }

    .sidebar-action {
      border: 1px solid transparent;
      color: #243043;
      background: transparent;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .sidebar-actions {
      display: grid;
      gap: 1px;
      width: 100%;
    }

    .sidebar-text {
      min-width: 0;
      line-height: 1;
      white-space: nowrap;
    }

    .sidebar-search-wrap {
      width: 100%;
      display: grid;
      gap: 0;
    }

    .sidebar-search-trigger,
    .sidebar-search-field {
      border: 1px solid transparent;
      color: #4f5b6d;
      background: transparent;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .sidebar-search-trigger:hover,
    .sidebar-search-field:hover,
    .sidebar-search-field:focus-within {
      color: var(--ink);
      background: #f8fafc;
      border-color: rgba(47, 111, 237, 0.28);
      transform: translateY(-1px);
    }

    .sidebar-search-field {
      display: none;
      border-color: var(--line);
      background: #ffffff;
    }

    .sidebar-search-wrap.search-open .sidebar-search-trigger {
      display: none;
    }

    .sidebar-search-wrap.search-open .sidebar-search-field {
      display: flex;
    }

    .sidebar-search-field input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font: inherit;
      font-size: var(--ui-font-size);
      font-weight: 500;
      line-height: 1;
    }

    .sidebar-search-field input::placeholder {
      color: var(--faint);
    }

    .sidebar-section {
      display: grid;
      gap: 8px;
      min-height: 0;
    }

    .history-section {
      flex: 1;
      grid-template-rows: auto minmax(0, 1fr);
      padding-top: 4px;
    }

    .sidebar-label {
      padding: 3px 6px 2px;
      color: var(--faint);
      font-size: 12px;
      font-weight: 800;
    }

    .history-list {
      grid-row: 2;
      display: grid;
      grid-auto-rows: min-content;
      align-content: start;
      gap: 6px;
      overflow: visible;
      padding-right: 2px;
    }

    .history-section:not(.has-history) .history-list {
      display: none;
    }

    .history-row {
      position: relative;
      width: 100%;
      min-height: 42px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 30px;
      align-items: center;
      border-radius: 9px;
      color: #4f5b6d;
      background: transparent;
      transition: background 160ms ease, color 160ms ease;
    }

    .history-row.menu-open {
      z-index: 8;
    }

    .history-row:hover,
    .history-row.menu-open {
      color: var(--ink);
      background: #f4f7fb;
    }

    .history-main {
      min-width: 0;
      min-height: 42px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      padding: 9px 10px;
      border: 0;
      border-radius: 9px 0 0 9px;
      color: inherit;
      background: transparent;
      font-size: var(--ui-font-size);
      line-height: 1;
      text-align: left;
    }

    .history-star {
      display: none;
      color: #f2a900;
      font-size: 14px;
      line-height: 1;
    }

    .history-row.is-favorite .history-star {
      display: inline;
    }

    .history-title {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-menu-button {
      width: 30px;
      height: 34px;
      display: grid;
      place-items: center;
      margin-right: 4px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #6d7787;
      background: transparent;
      transition: opacity 160ms ease, background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .history-menu-button:hover {
      color: var(--ink);
      background: #e8edf4;
      border-color: #d8e0ea;
    }

    .history-menu {
      position: absolute;
      top: 38px;
      right: -104px;
      z-index: 5;
      min-width: 116px;
      display: none;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 16px 34px rgba(19, 28, 44, 0.12);
    }

    .history-row.menu-open .history-menu {
      display: grid;
      gap: 2px;
    }

    .history-menu button {
      width: 100%;
      min-height: 30px;
      padding: 6px 9px;
      border: 0;
      border-radius: 7px;
      color: #344054;
      background: transparent;
      font-size: var(--ui-font-size);
      line-height: 1.2;
      text-align: left;
    }

    .history-menu button:hover {
      color: var(--ink);
      background: #f4f7fb;
    }

    .history-menu button[data-history-action="delete"] {
      color: #bc3b2d;
    }

    .history-empty {
      grid-row: 2;
      align-self: stretch;
      display: grid;
      place-items: center;
      padding: 8px 7px;
      color: var(--faint);
      font-size: 12.5px;
      line-height: 1.45;
      text-align: center;
    }

    .history-section.has-history .history-empty {
      display: none;
    }

    .sidebar-collapsed .app-sidebar {
      width: var(--sidebar-width);
      padding: 18px 14px;
      overflow: visible;
    }

    .sidebar-collapsed .sidebar-head {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      min-height: auto;
      margin-bottom: 4px;
    }

    .sidebar-collapsed .sidebar-actions {
      gap: 4px;
    }

    .sidebar-collapsed .sidebar-icon-button,
    .sidebar-collapsed .sidebar-action,
    .sidebar-collapsed .sidebar-search-trigger,
    .sidebar-collapsed .sidebar-search-field {
      justify-content: center;
      width: 40px;
      height: 40px;
      min-height: 40px;
      padding: 0;
      border-color: transparent;
      background: transparent;
    }

    .sidebar-collapsed .sidebar-icon-button:hover,
    .sidebar-collapsed .sidebar-action:hover,
    .sidebar-collapsed .sidebar-search-trigger:hover,
    .sidebar-collapsed .sidebar-search-field:hover {
      color: var(--ink);
      background: #f8fafc;
      border-color: rgba(47, 111, 237, 0.28);
      transform: translateY(-1px);
    }

    .sidebar-collapsed .sidebar-search-field {
      display: none;
    }

    .sidebar-collapsed .sidebar-search-wrap.search-open .sidebar-search-trigger {
      display: flex;
    }

    .sidebar-collapsed .sidebar-search-field input {
      display: none;
    }

    .sidebar-collapsed .sidebar-text,
    .sidebar-collapsed .sidebar-label,
    .sidebar-collapsed .history-list,
    .sidebar-collapsed .history-empty {
      display: none;
    }

    .view {
      display: none;
      animation: viewIn 240ms ease both;
    }

    .view.active {
      display: block;
    }

    .home.view.active {
      display: flex;
    }

    .home {
      width: calc(100% - var(--sidebar-width));
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      padding: clamp(48px, 7vh, 86px) var(--page-gutter) 48px;
      flex-direction: column;
      justify-content: center;
      transition: margin-left 220ms ease, width 220ms ease;
    }

    .home-hero {
      width: min(var(--home-max), 100%);
      margin: 0 auto;
      text-align: center;
    }

    .eyebrow {
      display: none;
    }

    h1 {
      max-width: 720px;
      margin: 0 auto 18px;
      font-size: clamp(40px, 5.4vw, 64px);
      line-height: 1.08;
      letter-spacing: 0;
      color: #0570f7;
      font-weight: 850;
    }

    .lead {
      display: block;
      margin: 0 auto clamp(34px, 4.6vh, 52px);
      color: #222936;
      font-size: clamp(19px, 2vw, 30px);
      font-weight: 500;
      line-height: 1.45;
    }

    .composer {
      width: min(var(--home-max), 100%);
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .composer textarea {
      width: 100%;
      min-height: 132px;
      resize: none;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      line-height: 1.65;
      font-size: 15px;
    }

    .composer textarea::placeholder {
      color: #98a3b2;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      border-top: 0;
      padding-top: 8px;
    }

    .hint {
      display: none;
    }

    .send-button {
      width: 42px;
      height: 42px;
      min-width: 42px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      border: 0;
      border-radius: 11px;
      color: #ffffff;
      background: var(--blue);
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .send-button:hover {
      background: #245ecb;
      transform: translateY(-1px);
    }

    .send-button:disabled {
      color: #8f99a8;
      background: #eef1f5;
      cursor: not-allowed;
      transform: none;
    }

    .send-button svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
    }

    .primary-btn,
    .ghost-btn {
      min-height: 40px;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 800;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .primary-btn {
      border: 0;
      color: #ffffff;
      background: var(--blue);
    }

    .primary-btn:hover {
      background: #245ecb;
      transform: translateY(-1px);
    }

    .primary-btn:disabled {
      background: #bac4d1;
      cursor: not-allowed;
      transform: none;
    }

    .ghost-btn {
      border: 1px solid rgba(47, 111, 237, 0.24);
      color: var(--blue);
      background: #ffffff;
    }

    .trend-section {
      width: min(var(--home-max), 100%);
      margin: 34px auto 0;
    }

    .section-head {
      display: block;
      margin-bottom: 14px;
    }

    .section-head h2 {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .section-head::after {
      content: "";
      display: block;
      margin-top: 8px;
      height: 1px;
      width: 100%;
      background: var(--line);
    }

    .section-head p {
      display: none;
    }

    .trend-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .trend-card {
      position: relative;
      overflow: hidden;
      min-height: 126px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      padding: 17px;
      text-align: left;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(248, 251, 255, 0.84));
      border: 1px solid rgba(221, 228, 236, 0.86);
      border-radius: 14px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .trend-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(47, 111, 237, 0.08), transparent 42%);
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .trend-card:hover {
      transform: translateY(-3px);
      border-color: rgba(47, 111, 237, 0.45);
      box-shadow: 0 18px 38px rgba(19, 28, 44, 0.08);
      background: #ffffff;
    }

    .trend-card:hover::before {
      opacity: 1;
    }

    .case-domain {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      width: max-content;
    }

    .domain-label {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      color: var(--blue);
      background: rgba(47, 111, 237, 0.08);
      font-size: 12px;
      line-height: 1;
      font-weight: 800;
    }

    .domain-mark {
      display: none;
    }

    .trend-card h3 {
      margin: 0;
      font-size: 14.5px;
      line-height: 1.45;
      letter-spacing: 0;
      position: relative;
      z-index: 1;
    }

    .trend-card p {
      display: none;
    }

    .card-action {
      color: var(--faint);
      font-size: 16px;
      line-height: 1;
      font-weight: 800;
      position: relative;
      z-index: 1;
    }

    .chat-view {
      min-height: 100vh;
      margin-left: var(--sidebar-width);
      width: calc(100% - var(--sidebar-width));
      transition: margin-left 220ms ease, width 220ms ease;
    }

    .chat-view.active {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }

    .chat-view.preview-open,
    .chat-view.preview-closing {
      grid-template-columns: minmax(0, 1fr) var(--preview-width);
      gap: 0;
    }

    .chat-view.preview-open .chat-shell,
    .chat-view.preview-closing .chat-shell {
      padding-left: 0;
      border-right: 1px solid var(--line);
    }

    .chat-view.preview-open .messages,
    .chat-view.preview-closing .messages {
      width: min(var(--chat-preview-max), calc(100% - var(--page-gutter) - var(--page-gutter)));
    }

    .chat-view.preview-open .chat-composer,
    .chat-view.preview-closing .chat-composer {
      width: min(var(--chat-preview-max), calc(100% - var(--page-gutter) - var(--page-gutter)));
    }

    .chat-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    .messages {
      width: min(var(--chat-max), calc(100% - var(--page-gutter) - var(--page-gutter)));
      margin: 0 auto;
      padding: clamp(28px, 4vh, 44px) 0 22px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .message {
      display: flex;
      margin: 0;
      animation: rise 320ms ease both;
    }

    .message + .message {
      margin-top: var(--turn-gap);
    }

    .message.user + .message.assistant {
      margin-top: var(--question-answer-gap);
    }

    .message.assistant + .message.user {
      margin-top: var(--answer-next-gap);
    }

    .message.user {
      justify-content: flex-end;
    }

    .assistant-output {
      width: min(760px, 100%);
      max-width: min(760px, 100%);
      display: grid;
      gap: 0;
    }

    .assistant-output > * {
      margin: 0;
    }

    .assistant-output > * + * {
      margin-top: var(--ai-block-gap);
    }

    .assistant-output > .process-card + .result-bubble {
      margin-top: var(--ai-result-gap);
    }

    .assistant-output > .result-bubble + .file-card.output-file {
      margin-top: var(--ai-file-gap);
    }

    .bubble {
      max-width: min(760px, 100%);
      padding: 15px 18px;
      border-radius: 8px;
      line-height: var(--body-line);
      font-size: var(--body-font-size);
      white-space: pre-wrap;
    }

    .user .bubble {
      color: #ffffff;
      background: var(--blue);
    }

    .assistant .bubble {
      background: #ffffff;
      border: 1px solid var(--line);
      box-shadow: 0 10px 28px rgba(19, 28, 44, 0.04);
    }

    .result-bubble {
      display: grid;
      gap: 0;
      padding: 16px 19px;
    }

    .result-text {
      display: grid;
      gap: 17px;
      white-space: normal;
    }

    .result-text p {
      margin: 0;
      color: #1c2430;
      font-size: 15px;
      line-height: var(--reading-line);
      font-weight: 400;
    }

    .result-text p:first-child {
      color: #151b25;
      font-weight: 400;
    }

    .process-card {
      width: min(760px, 100%);
      max-width: 760px;
      min-height: 0;
      padding: 16px 18px 4px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      animation: rise 320ms ease both;
    }

    .file-card {
      width: fit-content;
      max-width: min(520px, 100%);
      overflow: hidden;
      padding: 0;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: none;
      color: inherit;
      cursor: pointer;
      text-align: left;
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .file-card:hover {
      background: #ffffff;
      border-color: rgba(47, 111, 237, 0.36);
      transform: translateY(-1px);
    }

    .process-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 0 14px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      font-size: 13.5px;
      text-align: left;
      cursor: pointer;
    }

    .chevron {
      width: 16px;
      height: 16px;
      display: inline-grid;
      place-items: center;
      color: var(--faint);
      font-size: 0;
      line-height: 0;
      transition: transform 180ms ease;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .chevron::before {
      content: "";
      width: 6px;
      height: 6px;
      border-right: 1.7px solid currentColor;
      border-bottom: 1.7px solid currentColor;
      transform: rotate(45deg);
      transform-origin: 50% 50%;
    }

    .process-card.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .process-list {
      position: relative;
      padding: 0 0 2px 34px;
      display: grid;
      gap: 0;
    }

    .process-card.collapsed .process-list {
      display: none;
    }

    .process-card:not(.planned) {
      padding-bottom: 16px;
    }

    .process-card:not(.planned) .process-toggle {
      padding-bottom: 0;
    }

    .process-card:not(.planned) .process-list {
      display: none;
    }

    .process-card.planning-card .process-list {
      padding-left: 0;
    }

    .process-card.planning-card .process-list::before {
      display: none;
    }

    .process-list::before {
      content: "";
      position: absolute;
      top: 13px;
      bottom: 13px;
      left: 11px;
      width: 1px;
      background: repeating-linear-gradient(
        to bottom,
        #d8dee7 0,
        #d8dee7 5px,
        transparent 5px,
        transparent 10px
      );
    }

    .process-step {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 0 0 22px;
      opacity: 1;
      transition: opacity 200ms ease;
      animation: stepIn 260ms ease both;
    }

    .process-step.active {
      opacity: 1;
    }

    .process-step.done {
      opacity: 1;
    }

    .planning-step {
      padding: 0 0 16px;
    }

    .planning-step .step-dot {
      display: none;
    }

    .planning-step .step-copy {
      display: grid;
      gap: 10px;
    }

    .planning-spinner {
      width: 9px;
      height: 9px;
      border: 1.5px solid var(--blue);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }

    .process-card.planned .process-toggle .planning-spinner {
      border-color: var(--teal);
      background: var(--teal);
      animation: none;
      box-shadow: inset 0 0 0 2px #ffffff;
    }

    .planning-nodes {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      max-width: 520px;
      padding-left: 30px;
    }

    .planning-nodes::before {
      content: "";
      position: absolute;
      top: 9px;
      bottom: 9px;
      left: 9px;
      width: 1px;
      background: #d8dee7;
    }

    .plan-node {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #647084;
      font-size: 12.3px;
      line-height: 1.35;
      opacity: 1;
      transform: translateY(0);
      transition: color 180ms ease, opacity 180ms ease, transform 180ms ease;
    }

    .plan-node.queued {
      opacity: 0;
      transform: translateY(4px);
    }

    .plan-node.loading {
      color: #245ecb;
    }

    .plan-node.done {
      color: #3f4a5c;
    }

    .plan-index {
      position: absolute;
      left: -30px;
      top: -1px;
      width: 19px;
      height: 19px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      color: #647084;
      background: #ffffff;
      border: 1px solid #d8dee7;
      font-size: 10px;
      font-weight: 800;
    }

    .plan-node.loading .plan-index,
    .plan-node.done .plan-index {
      color: #ffffff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .plan-node.done .plan-index {
      background: var(--teal);
      border-color: var(--teal);
    }

    .plan-title {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .step-dot {
      position: absolute;
      left: -32px;
      top: 2px;
      width: 19px;
      height: 19px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--muted);
      background: #ffffff;
      border: 1px solid #d8dee7;
      font-size: 10px;
      font-weight: 800;
    }

    .active .step-dot {
      color: #ffffff;
      background: var(--blue);
      border-color: var(--blue);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .done .step-dot {
      color: #ffffff;
      background: var(--teal);
      border-color: var(--teal);
      animation: none;
    }

    .step-copy strong {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      color: #1b2430;
      font-size: 14.5px;
      line-height: 1.42;
    }

    .step-title-icon,
    .chip-icon {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      color: currentColor;
    }

    .step-title-icon {
      width: 15px;
      height: 15px;
      color: var(--blue);
    }

    .chip-icon {
      width: 13px;
      height: 13px;
    }

    .step-title-icon svg,
    .chip-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
    }

    .step-copy p {
      margin: 0;
      color: var(--muted);
      font-size: 12.8px;
      line-height: 1.58;
    }

    .step-copy p:empty {
      display: none;
    }

    .step-chips {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      align-items: start;
      padding-top: 1px;
    }

    .step-sections {
      display: grid;
      gap: 8px;
      padding-top: 5px;
    }

    .step-section {
      display: grid;
      gap: 6px;
      padding: 7px 0 9px;
      border: 0;
      border-top: 1px solid #edf1f5;
      background: transparent;
      transition: opacity 180ms ease;
    }

    .step-section:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .step-section.agent-section {
      background: transparent;
    }

    .section-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #273142;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.36;
      text-align: left;
      cursor: pointer;
    }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .section-actions {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
      flex: 0 0 auto;
    }

    .section-chevron {
      width: 14px;
      height: 14px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--faint);
      font-size: 12px;
      transition: transform 160ms ease;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .section-chevron {
      font-size: 0;
      line-height: 0;
    }

    .section-chevron::before {
      content: "";
      width: 5.5px;
      height: 5.5px;
      border-right: 1.6px solid currentColor;
      border-bottom: 1.6px solid currentColor;
      transform: rotate(45deg);
      transform-origin: 50% 50%;
    }

    .step-section.collapsed .section-chevron {
      transform: rotate(-90deg);
    }

    .agent-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 230px;
      min-width: 0;
      padding: 4px 7px;
      border: 1px solid #dce8ff;
      border-radius: 7px;
      color: #245ecb;
      background: #f4f8ff;
    }

    .agent-tag .agent-mark {
      width: 16px;
      height: 16px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      color: #2f6fed;
    }

    .agent-tag .agent-mark svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }

    .agent-tag .agent-name {
      color: #1f54b7;
      font-size: 11.5px;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-desc {
      margin: 0;
      color: var(--muted);
      font-size: 12.8px;
      line-height: 1.58;
    }

    .step-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      max-width: 100%;
      padding: 5px 9px;
      color: #4e5868;
      background: #f1f3f5;
      border-radius: 999px;
      font-size: 12.5px;
      line-height: 1.32;
      animation: chipIn 220ms ease both;
    }

    .step-chip.queued {
      display: none;
    }

    .step-chip.loading {
      color: #245ecb;
      background: #edf4ff;
    }

    .step-chip.loading::before {
      content: "";
      width: 8px;
      height: 8px;
      border: 1.5px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }

    .step-chip.done {
      color: #3c4656;
      background: #f1f3f5;
    }

    .section-summary {
      display: none;
      align-items: center;
      gap: 6px;
      width: fit-content;
      max-width: 100%;
      padding: 5px 8px;
      color: #465163;
      background: #f7f9fb;
      border: 1px solid #edf1f5;
      border-radius: 7px;
      font-size: 12.3px;
      line-height: 1.35;
      animation: chipIn 180ms ease both;
    }

    .step-section.collapsed .section-desc,
    .step-section.collapsed .step-chips {
      display: none;
    }

    .step-section.collapsed .section-summary {
      display: inline-flex;
    }

    .process-step.compacted .step-copy > p,
    .process-step.compacted > .step-copy > .step-chips {
      display: none;
    }

    .file-card.pending {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    .file-card.ready {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      transition: opacity 260ms ease, transform 260ms ease, border-color 180ms ease, background 180ms ease;
    }

    .output-file {
      justify-self: start;
      margin: 0;
    }

    .file-card {
      margin-top: 0;
      display: inline-block;
      vertical-align: top;
      white-space: normal;
      line-height: normal;
      animation: rise 320ms ease both;
    }

    .file-card.output-file {
      margin: 0;
    }

    .file-body {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      width: min(292px, 100%);
      padding: 9px;
    }

    .file-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: var(--blue);
      background: #edf4ff;
      font-weight: 900;
      font-size: 10px;
    }

    .file-main strong {
      display: block;
      margin-bottom: 2px;
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-main p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-composer-wrap {
      position: sticky;
      bottom: 0;
      padding: 10px 0 18px;
      background: linear-gradient(180deg, rgba(247, 248, 251, 0), var(--bg) 32%);
    }

    .preview-panel {
      display: none;
      position: sticky;
      top: 0;
      height: 100vh;
      background: rgba(255, 255, 255, 0.92);
      border: 0;
      border-radius: 0;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .chat-view.preview-open .preview-panel,
    .chat-view.preview-closing .preview-panel {
      display: flex;
      flex-direction: column;
      will-change: transform, opacity;
    }

    .chat-view.preview-open .preview-panel {
      animation: previewIn 280ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .chat-view.preview-closing .preview-panel {
      animation: previewOut 240ms cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .preview-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--soft);
    }

    .preview-kicker {
      display: block;
      margin-bottom: 5px;
      color: var(--faint);
      font-size: 12px;
      font-weight: 800;
    }

    .preview-head strong {
      display: block;
      font-size: 15px;
      line-height: 1.45;
    }

    .preview-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #ffffff;
      font-size: 18px;
      line-height: 1;
      text-decoration: none;
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .preview-body {
      flex: 1;
      overflow: auto;
      background: #ffffff;
    }

    .preview-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .search-results-body {
      padding: 12px;
      overflow: auto;
      background: #fbfcfe;
    }

    .search-status {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      margin: -12px -12px 10px;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(221, 228, 236, 0.86);
      color: #4f5b6d;
      background: rgba(251, 252, 254, 0.94);
      backdrop-filter: blur(14px);
      font-size: 12px;
      line-height: 1.3;
    }

    .search-status-main {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 8px;
      font-weight: 750;
    }

    .search-status-main::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: #2f6fed;
      box-shadow: 0 0 0 4px rgba(47, 111, 237, 0.12);
      animation: pulseDot 880ms ease-in-out infinite;
    }

    .search-status.is-complete .search-status-main::before {
      background: #25a36f;
      box-shadow: 0 0 0 4px rgba(37, 163, 111, 0.12);
      animation: none;
    }

    .search-results {
      display: grid;
      gap: 0;
      border-top: 1px solid rgba(221, 228, 236, 0.72);
    }

    .search-result-card {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      align-items: start;
      gap: 8px;
      min-height: 58px;
      padding: 9px 16px;
      border: 0;
      border-bottom: 1px solid rgba(221, 228, 236, 0.72);
      border-radius: 0;
      color: inherit;
      background: transparent;
      box-shadow: none;
      text-decoration: none;
      transition: background 180ms ease;
      animation: resultIn 260ms ease both;
    }

    .search-result-card::before {
      display: none;
    }

    .search-result-card:hover {
      background: #f7faff;
    }

    .search-result-favicon {
      position: relative;
      z-index: 1;
      width: 16px;
      height: 16px;
      margin-top: 1px;
      border-radius: 4px;
      object-fit: contain;
      background: #ffffff;
    }

    .search-result-fallback {
      position: relative;
      z-index: 1;
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      margin-top: 1px;
      border-radius: 4px;
      color: #245ecb;
      background: rgba(47, 111, 237, 0.09);
      font-size: 9px;
      font-weight: 900;
    }

    .search-result-main {
      position: relative;
      z-index: 1;
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .search-result-card strong {
      color: #18202d;
      font-size: 13.2px;
      line-height: 1.34;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-result-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12.2px;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes pulseDot {
      0%,
      100% {
        transform: scale(0.92);
        opacity: 0.65;
      }

      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .step-chip.search-link {
      cursor: pointer;
    }

    .step-chip.search-link:hover {
      color: #245ecb;
      background: #e8f1ff;
    }

    .chat-composer {
      width: min(var(--chat-max), calc(100% - var(--page-gutter) - var(--page-gutter)));
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 7px 7px 7px 14px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 12px 34px rgba(19, 28, 44, 0.06);
    }

    .chat-composer textarea {
      flex: 1;
      min-height: 38px;
      max-height: 160px;
      resize: none;
      border: 0;
      outline: 0;
      line-height: 1.55;
      color: var(--ink);
      padding: 8px 0;
      background: transparent;
    }

    .chat-composer .send-button {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 10px;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      min-height: 23px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--faint);
      animation: typing 1.1s ease-in-out infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 150ms;
    }

    .typing span:nth-child(3) {
      animation-delay: 300ms;
    }

    @keyframes viewIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes typing {
      0%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(47, 111, 237, 0.34);
      }

      50% {
        box-shadow: 0 0 0 9px rgba(47, 111, 237, 0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes stepIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes previewIn {
      from {
        opacity: 0;
        transform: translateX(48px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes previewOut {
      from {
        opacity: 1;
        transform: translateX(0);
      }

      to {
        opacity: 0;
        transform: translateX(48px);
      }
    }

    @keyframes resultIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes chipIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 1680px) {
      :root {
        --home-max: 980px;
        --chat-max: 960px;
        --chat-preview-max: 720px;
        --preview-width: clamp(460px, 34vw, 760px);
      }
    }

    @media (max-width: 1280px) {
      :root {
        --home-max: 860px;
        --chat-max: 820px;
        --chat-preview-max: 620px;
        --preview-width: clamp(360px, 34vw, 520px);
      }

      h1 {
        font-size: clamp(36px, 5vw, 56px);
      }

      .lead {
        font-size: clamp(18px, 2.2vw, 26px);
      }
    }

    @media (max-width: 1080px) {
      body:not(.sidebar-collapsed) {
        --sidebar-width: 224px;
      }

      .app-sidebar {
        padding-inline: 12px;
      }

      .trend-grid {
        grid-template-columns: 1fr;
      }

      .trend-card {
        min-height: 108px;
      }

      .chat-view.preview-open,
      .chat-view.preview-closing {
        grid-template-columns: minmax(0, 1fr) minmax(340px, 38vw);
      }
    }

    @media (max-width: 840px) {
      body {
        --sidebar-width: 72px;
        --page-gutter: 18px;
      }

      .app-sidebar {
        padding: 14px 12px;
      }

      .brand {
        width: 168px;
        min-width: 168px;
        height: 60px;
        overflow: visible;
      }

      .brand-logo {
        width: 168px;
      }

      .sidebar-head {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .sidebar-text,
      .sidebar-search-field input,
      .sidebar-label,
      .history-list,
      .history-empty {
        display: none;
      }

      .home {
        width: calc(100% - var(--sidebar-width));
        margin-left: var(--sidebar-width);
        min-height: 100svh;
        padding: 84px var(--page-gutter) 36px;
      }

      .trend-grid {
        grid-template-columns: 1fr;
      }

      .chat-view.preview-open,
      .chat-view.preview-closing {
        grid-template-columns: minmax(0, 1fr);
        padding-right: 0;
      }

      .chat-view.preview-open .chat-shell,
      .chat-view.preview-closing .chat-shell {
        padding-left: 0;
        border-right: 0;
      }

      .chat-view.preview-open .messages,
      .chat-view.preview-open .chat-composer,

    function insertLineBreak(textarea) {
      const start = textarea.selectionStart ?? textarea.value.length;
      const end = textarea.selectionEnd ?? textarea.value.length;
      textarea.value = `${textarea.value.slice(0, start)}\n${textarea.value.slice(end)}`;
      const nextPosition = start + 1;
      textarea.selectionStart = nextPosition;
      textarea.selectionEnd = nextPosition;
      textarea.dispatchEvent(new Event("input", { bubbles: true }));
    }

    function bindTextareaSubmit(textarea, form) {
      textarea.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.isComposing) return;
        if (event.metaKey || event.ctrlKey) {
          event.preventDefault();
          insertLineBreak(textarea);
          return;
        }
        event.preventDefault();
        if (!isGenerating && textarea.value.trim()) {
          form.requestSubmit();
        }
      });
    }

    function truncateTitle(value) {

    function loadHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem(HISTORY_STORAGE_KEY) || "[]");
        if (Array.isArray(saved)) {
          conversationHistory = saved
            .filter((item) => item && typeof item.question === "string")
            .slice(0, 8)
            .map((item) => ({
              question: item.question,
              scenarioKey: item.scenarioKey || "custom",
              title: item.title || "",
              favorite: Boolean(item.favorite)
            }));
        }
      } catch {
        conversationHistory = [];
      }
    }

    async function typeText(target, content, runId, speed = 18) {
      target.textContent = "";
      for (let i = 0; i < content.length; i += 1) {
        if (activeRunId !== runId) return false;
        target.textContent += content[i];
        if (i % 3 === 0) scrollToBottom();
        const char = content[i];
        await sleep(char === "\n" ? 220 : /[。；，、]/.test(char) ? speed * 5 : speed);
      }
      scrollToBottom();
      return true;
    }

    async function typeParagraphs(target, content, runId, speed = 14) {
      target.innerHTML = "";
      const paragraphs = content.split("\n").filter(Boolean);
      for (let i = 0; i < paragraphs.length; i += 1) {
        if (activeRunId !== runId) return false;
        const paragraph = document.createElement("p");
        target.appendChild(paragraph);
        const complete = await typeText(paragraph, paragraphs[i], runId, speed);
        if (!complete) return false;
        if (i < paragraphs.length - 1) await sleep(260);
      }
      return true;
    }

    function getSourceInitial(source) {
      const normalized = String(source || "").trim();
      if (!normalized) return "S";
      const firstAscii = normalized.match(/[A-Za-z]/);
      return firstAscii ? firstAscii[0].toUpperCase() : normalized.slice(0, 1);
    }

    function getHostname(url) {
      try {
        return new URL(url).hostname.replace(/^www\./, "");
      } catch {
        return "";
      }
    }

    function getFaviconUrl(url) {
      const hostname = getHostname(url);
      return hostname ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(hostname)}&sz=32` : "";
    }

    function renderSearchResultCard(item, index) {
      const faviconUrl = getFaviconUrl(item.url);
      return `
        <a class="search-result-card" href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">
          ${faviconUrl
            ? `<img class="search-result-favicon" src="${escapeHtml(faviconUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'), { className: 'search-result-fallback', textContent: '${escapeHtml(getSourceInitial(item.source))}' }))">`
            : `<span class="search-result-fallback" aria-hidden="true">${escapeHtml(getSourceInitial(item.source))}</span>`}
          <span class="search-result-main">
            <strong>${escapeHtml(item.title)}</strong>
            <p>${escapeHtml(item.summary)}</p>
          </span>
        </a>
      `;
    }

    function renderSearchStatus(group, revealCount) {
      const isComplete = revealCount >= group.results.length;
      return `
        <div class="search-status${isComplete ? " is-complete" : ""}" data-search-status>
          <span class="search-status-main">已识别到 ${Math.min(revealCount, group.results.length)} 个相关结果</span>
        </div>
      `;
    }

    function renderSearchResults(group, revealCount) {
      const visibleResults = group.results.slice(0, revealCount);
      return `
        ${renderSearchStatus(group, revealCount)}
        <div class="search-results" data-search-results>
          ${visibleResults.map((item, index) => renderSearchResultCard(item, index)).join("")}
        </div>
      `;
    }

    function openSearchPanel(searchKey, query, options = {}) {
      const group = searchResultGroups[searchKey];
      if (!group) return;
      if (options.auto && sidePanelDismissed) return;
      const revealCount = typeof options.revealCount === "number" ? options.revealCount : group.results.length;
      panelKicker.textContent = "检索结果";
      panelTitle.textContent = query || group.title;
      panelDownload.style.display = "none";
      panelBody.className = "preview-body search-results-body";
      panelBody.innerHTML = renderSearchResults(group, Math.min(revealCount, group.results.length));
      renderedSearchKey = searchKey;
      renderedSearchCount = Math.min(revealCount, group.results.length);
      openSidePanel(options);
    }

    function appendSearchResults(searchKey, query, revealCount, options = {}) {
      const group = searchResultGroups[searchKey];
      if (!group) return;
      if (options.auto && sidePanelDismissed) return;
      const nextCount = Math.min(revealCount, group.results.length);
      if (renderedSearchKey !== searchKey || panelBody.className !== "preview-body search-results-body") {
        openSearchPanel(searchKey, query || group.title, { ...options, revealCount: nextCount });
        return;
      }
      panelKicker.textContent = "检索结果";
      panelTitle.textContent = query || group.title;
      panelDownload.style.display = "none";
      openSidePanel(options);
      const list = panelBody.querySelector("[data-search-results]");
      if (!list) {
        openSearchPanel(searchKey, query || group.title, { ...options, revealCount: nextCount });
        return;
      }
      const status = panelBody.querySelector("[data-search-status]");
      if (status) {
        status.outerHTML = renderSearchStatus(group, nextCount);
      }
      for (let i = renderedSearchCount; i < nextCount; i += 1) {
        list.insertAdjacentHTML("beforeend", renderSearchResultCard(group.results[i], i));
      }
      renderedSearchCount = nextCount;
      panelBody.scrollTo({ top: panelBody.scrollHeight, behavior: "smooth" });
    }

    function startAutoSearchPanel(searchKey) {
      if (sidePanelDismissed) return;
      if (activeAutoSearchKey !== searchKey) {
        activeAutoSearchKey = searchKey;
        activeAutoSearchCount = 0;
      }
      const group = searchResultGroups[searchKey];
      openSearchPanel(searchKey, group?.title, { auto: true, revealCount: activeAutoSearchCount });
    }

    function revealAutoSearchResult(searchKey) {
      if (sidePanelDismissed) return;
      const group = searchResultGroups[searchKey];
      if (!group) return;
      if (activeAutoSearchKey !== searchKey) {
        activeAutoSearchKey = searchKey;
        activeAutoSearchCount = 0;
      }
      activeAutoSearchCount = Math.min(activeAutoSearchCount + 1, group.results.length);
      appendSearchResults(searchKey, group.title, activeAutoSearchCount, { auto: true });
    }

    function searchRevealDelay(index, total) {
      const cadence = [240, 320, 280, 380, 260, 340, 300];
      const densityAdjustment = total > 10 ? -35 : total < 5 ? 80 : 0;
      return Math.max(210, cadence[index % cadence.length] + densityAdjustment);
    }

    async function revealSearchResultsForChip(searchKey, runId) {
      const group = searchResultGroups[searchKey];
      if (!group) return;
      if (sidePanelDismissed) {
        await sleep(900);
        return true;
      }
      startAutoSearchPanel(searchKey);
      await sleep(360);
      for (let i = activeAutoSearchCount; i < group.results.length; i += 1) {
        if (activeRunId !== runId) return false;
        if (sidePanelDismissed) return true;
        revealAutoSearchResult(searchKey);
        await sleep(searchRevealDelay(i, group.results.length));
        if ((i + 1) % 5 === 0 && i + 1 < group.results.length) {
          await sleep(360);
        }
      }
      await sleep(group.results.length >= 10 ? 2200 : group.results.length <= 4 ? 1500 : 1850);
      return true;
    }

    function closePreview(immediate = false, userInitiated = false) {
      clearTimeout(previewCloseTimer);
      if (userInitiated) sidePanelDismissed = true;
      if (immediate) {
        chatView.classList.remove("preview-open", "preview-closing");
        reportPreview.setAttribute("aria-hidden", "true");
        return;
      }
      if (!chatView.classList.contains("preview-open")) {
        chatView.classList.remove("preview-closing");
        reportPreview.setAttribute("aria-hidden", "true");
        return;
      }
      chatView.classList.remove("preview-open");
      chatView.classList.add("preview-closing");
      previewCloseTimer = setTimeout(() => {
        chatView.classList.remove("preview-closing");
        reportPreview.setAttribute("aria-hidden", "true");
      }, 260);
    }

    function addProcessCard(output) {
      const card = document.createElement("div");
      card.className = "process-card planning-card";
      card.innerHTML = `
        <button class="process-toggle" type="button" aria-expanded="true">
          <span class="chevron">⌄</span>
          <span class="planning-spinner"></span>

        <div class="process-list">
          <div class="process-step active planning-step">
            <div class="step-dot">1</div>
            <div class="step-copy">
              <div class="planning-nodes"></div>
            </div>
          </div>
        </div>
      `;
      card.querySelector(".process-toggle").addEventListener("click", () => {
        const collapsed = card.classList.toggle("collapsed");
        card.querySelector(".process-toggle").setAttribute("aria-expanded", String(!collapsed));
      });
      card.addEventListener("click", (event) => {
        const searchChip = event.target.closest("[data-search-key]");
        if (searchChip) {
          openSearchPanel(searchChip.dataset.searchKey, searchChip.dataset.searchQuery);
          return;
        }
        const toggle = event.target.closest("[data-section-toggle]");
        if (!toggle) return;
        toggle.closest(".step-section")?.classList.toggle("collapsed");
      });
      card.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const searchChip = event.target.closest("[data-search-key]");
        if (!searchChip) return;
        event.preventDefault();
        openSearchPanel(searchChip.dataset.searchKey, searchChip.dataset.searchQuery);
      });
      output.appendChild(card);
      scrollToBottom();
      return card;
    }

    function renderActionChip(chip, searchKey = "") {
      const chipSearchKey = chip.searchKey || searchKey;
      const canOpenSearch = chipSearchKey && chip.icon === "search";
      const attrs = canOpenSearch
        ? ` data-search-key="${escapeHtml(chipSearchKey)}" data-search-query="${escapeHtml(chip.label)}" role="button" tabindex="0" title="查看检索结果"`
        : "";
      return `<span class="step-chip queued${canOpenSearch ? " search-link" : ""}" data-chip${attrs}>${chipIcon(chip.icon)}${escapeHtml(chip.label)}</span>`;
    }

    function renderSection(section) {
      const isAgent = Boolean(section.agentName);
      return `
        <div class="step-section${isAgent ? " agent-section" : ""}">
          <button class="section-toggle" type="button" data-section-toggle>
            <span class="section-title">
              ${stepTitleIcon(section.icon)}
              ${escapeHtml(section.title)}
            </span>
            <span class="section-actions">
              ${isAgent ? `
                <span class="agent-tag">
                  <span class="agent-mark">${iconSvg("agent")}</span>
                  <span class="agent-name">${escapeHtml(section.agentName)}</span>
                </span>
              ` : ""}
              <span class="section-chevron">⌄</span>
            </span>
          </button>
          <p class="section-desc">${escapeHtml(section.text)}</p>
          <div class="step-chips">
            ${section.chips.map((chip) => renderActionChip(chip, section.searchKey)).join("")}
          </div>
          <div class="section-summary">${chipIcon(isAgent ? "agent" : "shield")}${escapeHtml(section.summary || "已完成")}</div>
        </div>
      `;
    }

    function appendProcessStep(card, step, index) {
      const list = card.querySelector(".process-list");
      const el = document.createElement("div");
      el.className = "process-step active";
      el.dataset.step = index;
      el.dataset.summary = step.summary || `${step.title}已完成`;
      const sections = step.sections || [{
        title: step.title,
        icon: step.icon,
        text: step.text,
        summary: step.summary,
        chips: step.chips || []
      }];
      const inner = `<div class="step-sections">${sections.map(renderSection).join("")}</div>`;
      el.innerHTML = `
        <div class="step-dot">${index + 1}</div>
        <div class="step-copy">
          ${step.sections ? `<strong>${stepTitleIcon(step.icon)}${step.title}</strong><p>${step.text}</p>` : ""}
          ${inner}
        </div>
      `;
      list.appendChild(el);
      scrollToBottom();
      return el;
    }

    function compactProcessStep(stepEl) {
      if (stepEl.classList.contains("compacted")) return;
      stepEl.classList.add("compacted");
      const sections = stepEl.querySelectorAll(".step-section");
      if (sections.length) {
        sections.forEach((section) => section.classList.add("collapsed"));
        return;
      }
      const copy = stepEl.querySelector(".step-copy");
      const summary = document.createElement("div");
      summary.className = "step-summary";
      summary.innerHTML = `${chipIcon("shield")}${escapeHtml(stepEl.dataset.summary || "已完成")}`;
      copy.appendChild(summary);
    }

    function expandProcessStep(stepEl) {
      stepEl.classList.remove("compacted");
      stepEl.querySelector(".step-summary")?.remove();
      stepEl.querySelectorAll(".step-section.collapsed").forEach((section) => section.classList.remove("collapsed"));
    }

    async function revealProcessStep(stepEl, runId, timings) {
      const chips = Array.from(stepEl.querySelectorAll("[data-chip]"));
      for (let i = 0; i < chips.length; i += 1) {
        if (activeRunId !== runId) return false;
        const chip = chips[i];
        chip.classList.remove("queued");
        chip.classList.add("loading");
        if (chip.dataset.searchKey) {
          const searchComplete = await revealSearchResultsForChip(chip.dataset.searchKey, runId);
          if (!searchComplete) return false;
        } else {
          scrollToBottom();
          await sleep(timings.chip[i] || timings.chip[0] || 720);
          if (activeRunId !== runId) return false;
        }
        chip.classList.remove("loading");
        chip.classList.add("done");
        scrollToBottom();
      }
      await sleep(timings.after || 260);
      return true;
    }

    async function showPlannedNodes(card, runId) {
      const planning = card.querySelector(".planning-step");
      if (!planning) return false;
      planning.querySelector(".planning-nodes").innerHTML = processSteps
        .map((step, index) => `<span class="plan-node queued" data-chip><span class="plan-index">${index + 1}</span><span class="plan-title">${escapeHtml(step.title)}</span></span>`)
        .join("");
      card.classList.add("planned");
      card.querySelector("[data-process-summary]").textContent = `已规划 ${processSteps.length} 个步骤`;
      const keepGoing = await revealProcessStep(planning, runId, {
        chip: [360, 420, 420, 380, 420, 360],
        after: 900
      });
      if (!keepGoing) return false;
      planning.classList.remove("active");
      planning.classList.add("done");
      planning.querySelector(".step-dot").textContent = "✓";
      return true;
    }

    function setProcessState(card, activeIndex) {
      card.querySelectorAll(".process-step").forEach((step, index) => {
        step.classList.toggle("active", index === activeIndex);
        step.classList.toggle("done", index < activeIndex);
        if (index < activeIndex) {
          compactProcessStep(step);
        } else if (index === activeIndex) {
          expandProcessStep(step);
        }
        const dot = step.querySelector(".step-dot");
        dot.textContent = index < activeIndex ? "✓" : index + 1;
      });
      if (activeIndex >= processSteps.length) {
        card.querySelector("[data-process-summary]").textContent = "执行流程已完成";
      }
    }

    function scrollToBottom() {
      if (suppressAutoScroll) return;
      requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }));
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function runAnalysis(scenarioKey, customQuestion, options = {}) {
      const runId = activeRunId + 1;
      activeRunId = runId;
      setGenerating(true);
      sidePanelDismissed = false;
      activeAutoSearchKey = "";
      activeAutoSearchCount = 0;
      const baseData = scenarioData[scenarioKey] || scenarioData.custom;
      const data = { ...baseData, question: customQuestion || baseData.question };

      try {
        if (options.saveHistory !== false) {
          addHistoryEntry(data.question, scenarioKey);
        }
        showChat();
        addMessage("user", data.question);

        const assistantOutput = createAssistantTurn();
        const processCard = addProcessCard(assistantOutput);
        requestAnimationFrame(forcePageTop);
        await sleep(4200);
        if (activeRunId !== runId) return;
        suppressAutoScroll = false;
        const planned = await showPlannedNodes(processCard, runId);
        if (!planned || activeRunId !== runId) return;
        await sleep(1200);
        if (activeRunId !== runId) return;
        processCard.querySelector(".planning-step")?.remove();
        processCard.classList.remove("planning-card");
        processCard.querySelector("[data-process-summary]").textContent = "执行流程";

        for (let i = 0; i < processSteps.length; i += 1) {
          if (activeRunId !== runId) return;
          const stepEl = appendProcessStep(processCard, processSteps[i], i);
          setProcessState(processCard, i);
          const keepGoing = await revealProcessStep(stepEl, runId, processTimings[i] || { chip: [760], after: 420, pause: 220 });
          if (!keepGoing) return;
          setProcessState(processCard, i + 1);
          await sleep((processTimings[i] || { pause: 220 }).pause);
        }

        if (activeRunId !== runId) return;
        setProcessState(processCard, processSteps.length);
        await addResultBubble(assistantOutput, data, runId);
        if (activeRunId === runId && !sidePanelDismissed) {
          openReportPanel({ auto: true });
        }
      } finally {
        if (activeRunId === runId) {
          setGenerating(false);
        }
      }
    }

    async function runFollowUp(question) {
      const runId = activeRunId + 1;
      activeRunId = runId;
      setGenerating(true);
      try {
        addMessage("user", question);

        const assistantOutput = createAssistantTurn();
        await sleep(360);
        if (activeRunId !== runId) return;
        await addAssistantBubble(assistantOutput, "目前这是 demo，暂不支持继续追问。", runId);
      } finally {
        if (activeRunId === runId) {
          setGenerating(false);
        }
      }
    }

    questionInput.addEventListener("input", () => {
      selectedScenarioKey = null;
      updateSendStates();
    });
    bindTextareaSubmit(questionInput, questionForm);

    questionForm.addEventListener("submit", (event) => {
      event.preventDefault();
      event.submitter?.blur();
      const question = questionInput.value.trim();
      if (!question || isGenerating) return;
      runAnalysis(selectedScenarioKey || "custom", question);
    });

    document.querySelectorAll(".trend-card").forEach((card) => {
      card.addEventListener("click", () => {
        const scenario = scenarioData[card.dataset.scenario];
        if (!scenario) return;
        selectedScenarioKey = card.dataset.scenario;
        questionInput.value = scenario.question;
        updateSendStates();
        questionInput.focus();
      });
    });

    chatInput.addEventListener("input", () => {
      updateSendStates();
      chatInput.style.height = "auto";
      chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + "px";
    });
    bindTextareaSubmit(chatInput, chatForm);

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const question = chatInput.value.trim();
      if (!question || isGenerating) return;
      chatInput.value = "";
      chatInput.style.height = "auto";
      updateSendStates();
      runFollowUp(question);
    });

    brandHome.addEventListener("click", showHome);
    newChatBtn.addEventListener("click", showHome);
    sidebarToggle.addEventListener("click", () => {
      const collapsed = document.body.classList.toggle("sidebar-collapsed");
      sidebarToggle.setAttribute("aria-label", collapsed ? "展开侧边栏" : "收起侧边栏");
      sidebarToggle.setAttribute("title", collapsed ? "展开侧边栏" : "收起侧边栏");
    });
    historySearchTrigger.addEventListener("click", () => {
      if (document.body.classList.contains("sidebar-collapsed")) {
        document.body.classList.remove("sidebar-collapsed");
        sidebarToggle.setAttribute("aria-label", "收起侧边栏");
        sidebarToggle.setAttribute("title", "收起侧边栏");
      }
      historySearchWrap.classList.add("search-open");
      requestAnimationFrame(() => historySearch.focus());
    });
    historySearch.addEventListener("input", renderHistory);
    historySearch.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !historySearch.value.trim()) {
        historySearchWrap.classList.remove("search-open");
        historySearchTrigger.focus();
      }
    });
    historyList.addEventListener("click", (event) => {
      const row = event.target.closest("[data-history-index]");
      if (!row) return;
      const index = Number(row.dataset.historyIndex);
      const record = conversationHistory[index];
      if (!record) return;
      const menuButton = event.target.closest("[data-history-menu]");
      if (menuButton) {
        const isOpen = row.classList.contains("menu-open");
        closeHistoryMenus();
        row.classList.toggle("menu-open", !isOpen);
        menuButton.setAttribute("aria-expanded", String(!isOpen));
        return;
      }

      const actionButton = event.target.closest("[data-history-action]");
      if (actionButton) {
        const action = actionButton.dataset.historyAction;
        if (action === "rename") {
          const nextTitle = prompt("重命名对话", getHistoryTitle(record));
          if (nextTitle && nextTitle.trim()) {
            conversationHistory[index] = { ...record, title: nextTitle.trim() };
            persistHistory();
            renderHistory();
          }
        }
        if (action === "favorite") {
          conversationHistory[index] = { ...record, favorite: !record.favorite };
          persistHistory();
          renderHistory();
        }
        if (action === "delete" && confirm("删除这条历史记录？")) {
          conversationHistory.splice(index, 1);
          persistHistory();
          renderHistory();
        }
        return;
      }

      if (event.target.closest("[data-history-open]")) {
        closeHistoryMenus();
        runAnalysis(record.scenarioKey || "custom", record.question, { saveHistory: false });
      }
    });
    document.addEventListener("click", (event) => {
      if (!event.target.closest(".history-row")) {
        closeHistoryMenus();
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeHistoryMenus();
      }
    });
    previewClose.addEventListener("click", () => closePreview(false, true));

    window.addEventListener("popstate", () => {
      if (location.hash !== "#chat") {
        activeRunId += 1;
        messages.innerHTML = "";
        closePreview(true);
        chatView.classList.remove("active");
        homeView.classList.add("active");
      }
    });

    if (location.hash === "#chat") {
      history.replaceState({ view: "home" }, "", location.pathname);
    }
    loadHistory();
    renderHistory();
  </script>


</body>
