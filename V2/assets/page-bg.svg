<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" fill="none">
  <rect width="1800" height="1100" fill="#F7FAFF"/>
  <defs>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(500 230) rotate(28) scale(760 390)">
      <stop stop-color="#EAF3FF"/>
      <stop offset=".48" stop-color="#F4F8FF" stop-opacity=".46"/>
      <stop offset="1" stop-color="#F7FAFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1335 790) rotate(-20) scale(780 390)">
      <stop stop-color="#F0FAF8"/>
      <stop offset=".5" stop-color="#F7FCFB" stop-opacity=".28"/>
      <stop offset="1" stop-color="#F7FAFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 360) rotate(8) scale(560 260)">
      <stop stop-color="#EEF2FF" stop-opacity=".68"/>
      <stop offset=".62" stop-color="#F6F8FF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#F7FAFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flowA" x1="210" y1="840" x2="1620" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F6FED" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#2F6FED" stop-opacity=".06"/>
      <stop offset="1" stop-color="#5EAFA7" stop-opacity=".085"/>
    </linearGradient>
    <linearGradient id="flowB" x1="315" y1="970" x2="1500" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EAFA7" stop-opacity=".045"/>
      <stop offset=".48" stop-color="#2F6FED" stop-opacity=".055"/>
      <stop offset="1" stop-color="#2F6FED" stop-opacity=".11"/>
    </linearGradient>
    <pattern id="dotGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#2F6FED" fill-opacity=".075"/>
    </pattern>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="54"/>
    </filter>
    <filter id="microBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1800" height="1100" fill="url(#blueGlow)"/>
  <rect width="1800" height="1100" fill="url(#cyanGlow)"/>
  <rect width="1800" height="1100" fill="url(#violetGlow)"/>

  <g filter="url(#softBlur)" opacity=".62">
    <ellipse cx="460" cy="300" rx="310" ry="145" fill="#E3F0FF"/>
    <ellipse cx="1250" cy="760" rx="380" ry="165" fill="#EFFAF8"/>
    <ellipse cx="1050" cy="260" rx="260" ry="105" fill="#E5ECFF"/>
  </g>

  <g opacity=".56">
    <path d="M115 815C312 690 505 704 706 588C914 468 1035 306 1260 300C1428 296 1558 370 1710 520" stroke="url(#flowA)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M230 925C454 782 642 780 828 670C1030 552 1165 468 1370 488C1508 502 1625 575 1738 682" stroke="url(#flowB)" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M420 1015C610 900 770 888 948 784C1100 695 1254 630 1438 666" stroke="url(#flowA)" stroke-width="1.7" stroke-linecap="round" opacity=".58"/>
  </g>

  <g opacity=".2">
    <rect x="1050" y="142" width="420" height="280" fill="url(#dotGrid)" transform="rotate(-8 1050 142)"/>
    <rect x="260" y="610" width="360" height="250" fill="url(#dotGrid)" transform="rotate(10 260 610)"/>
  </g>

  <g filter="url(#microBlur)" opacity=".32">
    <circle cx="706" cy="588" r="8" fill="#7EA9F7"/>
    <circle cx="1260" cy="300" r="9" fill="#7EA9F7"/>
    <circle cx="1370" cy="488" r="8" fill="#5EAFA7"/>
    <circle cx="1250" cy="760" r="8" fill="#5EAFA7"/>
  </g>

  <g opacity=".32">
    <circle cx="706" cy="588" r="3.2" fill="#7EA9F7"/>
    <circle cx="1260" cy="300" r="3.5" fill="#7EA9F7"/>
    <circle cx="1370" cy="488" r="3.2" fill="#5EAFA7"/>
    <circle cx="1250" cy="760" r="3.2" fill="#5EAFA7"/>
  </g>
</svg>
